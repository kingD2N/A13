name: Compile Kernel Melt Rebase - POCO F4 GT (Ingres)

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Kernel source repo URL for marble (Melt Kernel). Paste any git URL here to override the default."
        required: true
        type: string
        default: "https://github.com/kingD2N/kernel_source_Melt_xiaomi_ingres"

      kernel_branch:
        description: "Branch on kernel_source above (independent from modules/devicetree branches below)"
        required: true
        type: choice
        default: "melt-MIX"
        options :
           - LazyGoogle_ORI
           - melt-rebase-4LazyGoogle
           - melt-MIX
           
      modules_branch:
        description: "Branch for the LineageOS modules repo (unaffected by kernel_source/kernel_branch above - currently defaults to lineage-23.2)"
        required: true
        type: string
        default: "lineage-23.2"

      devicetree_branch:
        description: "Branch for the Ingres-Centre devicetrees repo (this repo currently defaults to lineage-23.0, NOT lineage-23.2 - double check before running)"
        required: true
        type: string
        default: "lineage-23.2"

      ksu_type:
        description: "KernelSU Version"
        required: true
        type: choice
        default: "ReSukiSU"
        options:
          - None
          - Official-KernelSU
          - KernelSU-Next
          - KowSU
          - ReSukiSU
          - SukiSUUltra

      custom_name:
        description: "kernel"
        required: false
        type: choice
        default: MIX™-KERNEL
        options:
          - Melt-KERNEL
          - MIX™-KERNEL
          - LazyGoogle-KERNEL

      susfs:
        description: "Add susfs support"
        required: true
        type: boolean
        default: true

      susfs_commit:
        description: "Commit SHA for susfs4ksu on gki-android12-5.10. Leave empty (default) to always track the latest commit on the branch tip - the SUS_KSTAT/statfs extern-declaration bug from the 10 Sept 2026 rework (Numbersf/Action-Build issue #269) is now worked around automatically in the Compile Kernel step (missing extern decls are patched into fs/stat.c and fs/statfs.c in place at build time - no separate files kept in this repo to remember to maintain), so pinning is no longer required to avoid it. Set a short SHA here only if you want to pin/test a specific commit."
        required: false
        type: string
        default: ""

      BBG:
        description: "Add BBG support"
        required: true
        type: boolean
        default: true

      rekernel_netlink:
        description: "Add Re-Kernel support (Netlink)"
        required: true
        type: boolean
        default: true

      rekernel_ebpf:
        description: "Add Re-Kernel support (eBPF)"
        required: true
        type: boolean
        default: true

      droidspaces:
        description: "Add DroidSpaces support"
        required: true
        type: boolean
        default: true

      nomount:
        description: "Add NoMount support (kernel VFS path redirection/injection, maxsteeel/nomount@master - auto-updates to whatever's newest on that branch each run; may conflict with susfs since both patch fs/namei.c)"
        required: true
        type: boolean
        default: true

      ccache_update:
        description: "Refresh ccache (overwrite the repo cache with this build's ccache; enable when u changed configs/source or need a clean cache)"
        required: true
        type: boolean
        default: true


jobs:
  Build_Kernel:
    env:
        GH_TOKEN: ${{ github.token }}
        SOC: sm8450
        CCACHE_KEY: ccache-ecsv3-ingres-sm8450
        # Public link of your Telegram group (shown as "JOIN" button in the push).
        TG_GROUP_URL: ""
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Free up disk space
        run: |
          
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison flex \
          libssl-dev \
          libelf-dev \
          libdw-dev \
          build-essential \
          lz4 \
          git \
          python3 \
          curl \
          dwarves \
          cpio \
          ccache \
          zstd \
          unzip \
          patchutils \
          gcc-aarch64-linux-gnu

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules -b ${{ inputs.kernel_branch }} ${{ inputs.kernel_source }} ${SOC}
          git clone --depth=1 --recurse-submodules --shallow-submodules -b ${{ inputs.modules_branch }} https://github.com/LineageOS/android_kernel_xiaomi_${SOC}-modules.git ${SOC}-modules


          rm -rf ${SOC}/arch/arm64/boot/dts/vendor
          git clone --depth=1 --recurse-submodules --shallow-submodules -b ${{ inputs.devicetree_branch }} https://github.com/Ingres-Centre/android_kernel_xiaomi_${SOC}-devicetrees.git ${SOC}/arch/arm64/boot/dts/vendor \
            || git clone --depth=1 --recurse-submodules --shallow-submodules https://github.com/Ingres-Centre/android_kernel_xiaomi_${SOC}-devicetrees.git ${SOC}/arch/arm64/boot/dts/vendor

      - name: Detect kernel version
        run: |

          KVERSION=$(grep -m1 '^VERSION = ' ${SOC}/Makefile | awk '{print $3}')
          KPATCHLEVEL=$(grep -m1 '^PATCHLEVEL = ' ${SOC}/Makefile | awk '{print $3}')
          KSUBLEVEL=$(grep -m1 '^SUBLEVEL = ' ${SOC}/Makefile | awk '{print $3}')

          if [[ -z "$KVERSION" || -z "$KPATCHLEVEL" || -z "$KSUBLEVEL" ]]; then
            echo "::error::Couldn't parse VERSION/PATCHLEVEL/SUBLEVEL from ${SOC}/Makefile (got '${KVERSION}.${KPATCHLEVEL}.${KSUBLEVEL}'). Has the Makefile's header format changed on this branch?"
            exit 1
          fi

          KERNEL_BASE="android12-${KVERSION}.${KPATCHLEVEL}.${KSUBLEVEL}"
          echo "==> Detected kernel version: ${KERNEL_BASE}"
          echo "KERNEL_BASE=${KERNEL_BASE}" >> $GITHUB_ENV

      - name: Download LLVM (latest stable release)
        run: |
          mkdir -p toolchains
          cd toolchains

          
          LLVM_TAG=$(gh release list --repo llvm/llvm-project --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          if [[ -z "$LLVM_TAG" ]]; then
            echo "::error::Could not determine the latest llvm/llvm-project release tag via gh CLI."
            exit 1
          fi
          LLVM_VERSION="${LLVM_TAG#llvmorg-}"
          echo "==> Latest LLVM release: ${LLVM_TAG} (version ${LLVM_VERSION})"
          echo "LLVM_VERSION=${LLVM_VERSION}" >> $GITHUB_ENV

          ASSET="LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          URL="https://github.com/llvm/llvm-project/releases/download/${LLVM_TAG}/${ASSET}"
          if ! wget -q "$URL"; then
            echo "::error::Failed to download ${URL} - ${LLVM_TAG} may not publish a Linux-X64 tarball under the expected name. Check https://github.com/llvm/llvm-project/releases/tag/${LLVM_TAG} for the actual asset name."
            exit 1
          fi

          
          mkdir llvm
          tar -xf "${ASSET}" -C llvm --strip-components=1

      
      - name: Configure ccache dir and key
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_ingres" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          if [[ "${{ inputs.droidspaces }}" == true ]]; then
            CCACHE_REAL_KEY=${CCACHE_KEY}-Droidspaces
          else
            CCACHE_REAL_KEY=${CCACHE_KEY}-none
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: Purge old ccache (on refresh)
        if: ${{ inputs.ccache_update }}
        continue-on-error: true
        run: |
          echo "Deleting old repo ccache to force a fresh save..."
          gh cache delete "${CCACHE_REAL_KEY}-${{ runner.os }}-${{ inputs.kernel_branch }}" -R ${{ github.repository }} || echo "No old ccache to delete"

      - name: Restore ccache
        uses: actions/cache/restore@v6
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ inputs.kernel_branch }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: Compile Kernel
        run: |
          CLANG_ROOT="${GITHUB_WORKSPACE}/toolchains/llvm/bin"
          export PATH="${CLANG_ROOT}:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC="${CLANG_ROOT}/clang"
          export CXX="${CLANG_ROOT}/clang++"
          export HOSTCC="${CLANG_ROOT}/clang"
          export HOSTCXX="${CLANG_ROOT}/clang++"
          export LD="${CLANG_ROOT}/ld.lld"
          export AR="${CLANG_ROOT}/llvm-ar"
          export NM="${CLANG_ROOT}/llvm-nm"
          export OBJCOPY="${CLANG_ROOT}/llvm-objcopy"
          export OBJDUMP="${CLANG_ROOT}/llvm-objdump"
          export STRIP="${CLANG_ROOT}/llvm-strip"
          export KBUILD_BUILD_USER="KingD2N"
          export KBUILD_BUILD_HOST="Ingres"


          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          mkdir -p "${CCACHE_DIR}"
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "${CCACHE_DIR}/ccache.conf"
          ccache -M "${CCACHE_MAXSIZE}"
          ccache -o compression=true
          echo "ccache status before build:"
          ccache -s

          if [[ -n "${{ inputs.custom_name }}" ]]; then
            KERNEL_NAME="${{ inputs.custom_name }}"
          else
            KERNEL_NAME="${{ inputs.ksu_type }}"
          fi

          echo "KERNEL_NAME=${KERNEL_NAME}" >> $GITHUB_ENV

          cd ${SOC}

          case "${{ inputs.ksu_type }}" in

            "None")
              ;;

            "Official-KernelSU")
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
              ;;

            "KowSU")
               curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/main/kernel/setup.sh" | bash -s master
              ;;

            "KernelSU-Next")
              if [[ "${{ inputs.susfs }}" == true ]]; then
                curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
              else
                curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev
              fi
              ;;

            "ReSukiSU")
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
              ;;

            "SukiSUUltra")
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
              ;;
          esac

          if [[ "${{ inputs.susfs }}" == true ]]; then
            # Shallow clone when just tracking the branch tip (the common
            # case); only pay for full history when pinning to a specific
            # older commit, since checking that commit out needs it.
            if [[ -n "${{ inputs.susfs_commit }}" ]]; then
              git clone -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git susfs
              cd susfs
              echo "==> SUSFS: pinning to custom commit ${{ inputs.susfs_commit }}"
              git checkout "${{ inputs.susfs_commit }}"
            else
              git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git susfs
              cd susfs
              echo "==> SUSFS: using latest commit on branch gki-android12-5.10"
            fi

            SUSFS_COMMIT=$(git rev-parse --short HEAD)
            echo "SUSFS_COMMIT=${SUSFS_COMMIT}" >> $GITHUB_ENV
            echo "==> SUSFS: checked out commit ${SUSFS_COMMIT}"
            cp ./kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ..
            cp ./kernel_patches/fs/* ../fs/
            cp ./kernel_patches/include/linux/* ../include/linux/

            # Fix: susfs.c calls security_* helpers without directly
            # including linux/security.h (relies on a transitive include
            # that doesn't always survive on this kernel_source/LLVM combo).
            # Add it explicitly to avoid implicit-declaration errors.
            sed -i '1i #include <linux/security.h>' ../fs/susfs.c

            SUSFS_VERSION_TAG=$(sed -n 's/.*SUSFS_VERSION[[:space:]]*"\([^"]*\)".*/\1/p' kernel_patches/include/linux/susfs.h | head -n1)
            echo "SUSFS_VERSION_TAG=${SUSFS_VERSION_TAG:-unknown}" >> $GITHUB_ENV
            echo "==> SUSFS: detected version ${SUSFS_VERSION_TAG:-unknown} from susfs.h"

            cd ..

            # Always tracking the branch tip means any upstream change to
            # this patch's context (or drift from BBG/NoMount/DroidSpaces
            # already having touched the same fs/ files) can break
            # application with no warning - this is the actual mechanism
            # behind "worked yesterday, fails today after updating susfs".
            # Fail loudly with a clear pointer instead of a bare patch(1)
            # hunk dump, and leave any .rej files for the artifact-upload
            # step below to pick up.
            #
            # Fix (13 Sept 2026+): fs/stat.c and fs/statfs.c don't need
            # this patch's hunks at all - kernel_patches/fs/* above already
            # dropped in susfs4ksu's own complete, pre-patched copies of
            # both files, and the inline fixup below patches them again
            # in place regardless of what happens here. Their hunks in
            # this unified patch are pure redundancy for us.
            # That used to be harmless (patch -N quietly no-ops a hunk it
            # finds already applied), but during the ongoing SUS_KSTAT/
            # statfs rework, susfs4ksu's standalone fs/stat.c/fs/statfs.c
            # and this same patch's hunks for those two files have drifted
            # out of sync with EACH OTHER upstream (see Numbersf/Action-
            # Build#269 for the sibling case) - so -N's "already applied"
            # check no longer matches and every hunk for just these two
            # files hard-fails (patch-rejects artifact showed 6/6 and 3/3
            # hunks rejected on fs/stat.c and fs/statfs.c, every other
            # file in the same patch applying fine).
            # Strip those two files out of the patch before applying it,
            # rather than pinning susfs_commit to dodge it - every other
            # file's hunks (the ones that actually matter here) are
            # untouched and still fail loudly below if THEY drift.
            filterdiff -x '*fs/stat.c' -x '*fs/statfs.c' \
              50_add_susfs_in_gki-android12-5.10.patch \
              > 50_add_susfs_in_gki-android12-5.10.filtered.patch

            if [[ ! -s 50_add_susfs_in_gki-android12-5.10.filtered.patch ]]; then
              echo "::error::filterdiff produced an empty patch file - either it isn't installed correctly or the -x exclude globs matched everything. Refusing to silently skip every susfs hook instead of just fs/stat.c and fs/statfs.c."
              exit 1
            fi

            if grep -qE '^\+\+\+ .*fs/stat(fs)?\.c' 50_add_susfs_in_gki-android12-5.10.filtered.patch; then
              echo "::error::fs/stat.c or fs/statfs.c hunks are still present after filterdiff - this patch's --- /+++ header style doesn't match the -x globs above. Check the raw patch's path prefixing and adjust the -x patterns."
              exit 1
            fi

            # -N (--forward): still worth keeping for any other overlap
            # (e.g. BBG/NoMount/DroidSpaces touching the same fs/ files) -
            # this only ever silently skips a hunk that's genuinely already
            # applied; anything that doesn't match still fails loudly below.
            if ! patch -p1 -N < 50_add_susfs_in_gki-android12-5.10.filtered.patch; then
              echo "::error::SuSFS patch failed to apply cleanly against commit ${SUSFS_COMMIT} (fs/stat.c and fs/statfs.c hunks were excluded before this ran - see comment above, not the cause here). This almost always means susfs4ksu's upstream patch has drifted (a new commit shifted its context lines) or another enabled feature already modified the same fs/ files. Check this run's 'susfs-patch-rejects' artifact for the exact hunks that didn't match. The reliable fix for recurring breakage is pinning susfs_commit to a commit you've confirmed builds, instead of always tracking the branch tip."
              exit 1
            fi

            # Fix: once the SuSFS patch has applied cleanly, patch the
            # missing extern declarations directly into fs/stat.c and
            # fs/statfs.c in place (see susfs_commit description above) -
            # generated here instead of kept as separately-committed
            # "golden" files in this repo, so there is nothing extra to
            # remember to commit or keep in sync as susfs4ksu's ongoing
            # rework keeps moving. Each fix only fires if the symbol is
            # referenced and not already declared, so this is a no-op
            # once upstream fixes it on their end.
            SUSFS_EXTERN_FIXES=(
              "fs/stat.c:susfs_is_current_app_uid:CONFIG_KSU_SUSFS_SUS_KSTAT"
              "fs/stat.c:susfs_is_current_proc_no_su:CONFIG_KSU_SUSFS"
              "fs/statfs.c:susfs_is_current_app_uid:CONFIG_KSU_SUSFS_SUS_KSTAT"
              "fs/statfs.c:susfs_is_current_proc_umounted:CONFIG_KSU_SUSFS_SUS_MOUNT"
            )

            for fx_spec in "${SUSFS_EXTERN_FIXES[@]}"; do
              IFS=: read -r fx_file fx_func fx_guard <<< "$fx_spec"
              if grep -qE "extern[^;]*${fx_func}[[:space:]]*\(" "$fx_file"; then
                echo "[skip] ${fx_file}: ${fx_func} already declared"
                continue
              fi
              if ! grep -qE "${fx_func}[[:space:]]*\(" "$fx_file"; then
                echo "[skip] ${fx_file}: ${fx_func} not referenced, nothing to fix"
                continue
              fi
              fx_lastinc=$(grep -n '^#include' "$fx_file" | tail -1 | cut -d: -f1)
              if [[ -z "$fx_lastinc" ]]; then
                echo "::error::no #include lines found in ${fx_file} - cannot find a safe insertion point. susfs4ksu file structure has likely changed more than this fixup accounts for."
                exit 1
              fi
              {
                echo "#ifdef ${fx_guard}"
                echo "extern bool ${fx_func}(void);"
                echo "#endif"
              } > /tmp/_susfs_extern_block.txt
              sed -i "${fx_lastinc}r /tmp/_susfs_extern_block.txt" "$fx_file"
              echo "[fixed] ${fx_file}: added extern for ${fx_func}"
            done

            # Self-check: fail loudly instead of silently proceeding broken.
            for fx_spec in "${SUSFS_EXTERN_FIXES[@]}"; do
              IFS=: read -r fx_file fx_func fx_guard <<< "$fx_spec"
              if grep -qE "${fx_func}[[:space:]]*\(" "$fx_file" && ! grep -qE "extern[^;]*${fx_func}[[:space:]]*\(" "$fx_file"; then
                echo "::error::${fx_file} still calls ${fx_func}() with no extern declaration after the fixup"
                exit 1
              fi
            done
            echo "susfs stat.c/statfs.c extern check: OK"

            # Fix: same SUS_KSTAT/statfs rework as the extern fixup above,
            # one step further along. susfs.c (susfs_mark_inode_sus_kstat)
            # now calls two non-static wrapper functions around fs/statfs.c's
            # own static statfs_by_dentry()/calculate_f_flags() - neither
            # wrapper is defined yet in kernel_patches/fs/statfs.c or in
            # this patch's (excluded) hunks for that file, so susfs.c
            # compiles cleanly (it already has a visible prototype for
            # both, presumably from include/linux/susfs.h) and this only
            # surfaces as "undefined symbol" at the final vmlinux link.
            # Both wrapped functions are stock, unmodified fs/statfs.c
            # internals with a stable signature well predating this fork,
            # so a thin forwarding wrapper next to them is safe. Guarded
            # the same way as the fixup above - a no-op once susfs4ksu
            # ships the wrappers itself.
            SUSFS_MISSING_WRAPPERS=()
            for fx_wrapper in statfs_by_dentry_wrapper calculate_f_flags_wrapper; do
              if ! grep -q "${fx_wrapper}" fs/statfs.c; then
                SUSFS_MISSING_WRAPPERS+=("$fx_wrapper")
              fi
            done

            if [[ ${#SUSFS_MISSING_WRAPPERS[@]} -gt 0 ]]; then
              if ! grep -qE '^static int statfs_by_dentry\(' fs/statfs.c || ! grep -qE '^static int calculate_f_flags\(' fs/statfs.c; then
                echo "::error::statfs_by_dentry()/calculate_f_flags() not found in fs/statfs.c in the expected static-function form - susfs4ksu's rework has moved further than this fixup accounts for. Missing wrappers: ${SUSFS_MISSING_WRAPPERS[*]}"
                exit 1
              fi
              {
                echo ""
                echo "int statfs_by_dentry_wrapper(struct dentry *dentry, struct kstatfs *buf) { return statfs_by_dentry(dentry, buf); }"
                echo "int calculate_f_flags_wrapper(struct vfsmount *mnt) { return calculate_f_flags(mnt); }"
              } >> fs/statfs.c
              echo "[fixed] fs/statfs.c: added ${SUSFS_MISSING_WRAPPERS[*]}"
            fi

            echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> arch/arm64/configs/gki_defconfig
          fi

          if [[ "${{ inputs.nomount }}" == true ]]; then
            echo "::group::NoMount integration"
            if [[ "${{ inputs.susfs }}" == true ]]; then
              echo "::warning::susfs and nomount are both enabled - susfs's SUS_KSTAT patches fs/stat.c, which nomount's own VFS hooks may also touch. If anything below fails, try disabling one to isolate it."
            fi


            NOMOUNT_COMMIT=$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/master | cut -f1 | cut -c1-7)
            if [[ -z "$NOMOUNT_COMMIT" ]]; then
              echo "::warning::Could not resolve maxsteeel/nomount's master branch HEAD via git ls-remote - continuing anyway, but the release notes won't show a commit hash for this run."
              NOMOUNT_COMMIT="unknown"
            fi
            echo "NOMOUNT_COMMIT=${NOMOUNT_COMMIT}" >> $GITHUB_ENV
            echo "==> NoMount: using maxsteeel/nomount@master (${NOMOUNT_COMMIT})"

            curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh" | bash -s master
            echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/gki_defconfig
            echo "::endgroup::"
          fi

          if [[ "${{ inputs.BBG }}" == true ]]; then
            wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
            echo "CONFIG_BBG=y" >> arch/arm64/configs/gki_defconfig
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          fi

          if [[ "${{ inputs.rekernel_netlink }}" == true ]]; then
            git clone --depth=1 --recurse-submodules --shallow-submodules https://github.com/Sakion-Team/Re-Kernel.git rekernel-src
            bash rekernel-src/Integrate/patches.sh
            echo "CONFIG_REKERNEL=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_REKERNEL_NETWORK=y" >> arch/arm64/configs/gki_defconfig
          fi

          if [[ "${{ inputs.rekernel_ebpf }}" == true ]]; then
            
            echo "CONFIG_BPF_SYSCALL=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_BPF_JIT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_CGROUP_BPF=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_BPF_EVENTS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KPROBES=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_UPROBE_EVENTS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_NET_CLS_ACT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_NET_CLS_BPF=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_NET_ACT_BPF=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_NET_SCH_INGRESS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_DEBUG_INFO=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_DEBUG_INFO_BTF=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_DEBUG_INFO_BTF_MODULES=y" >> arch/arm64/configs/gki_defconfig
            echo "==> Re-Kernel eBPF selected; will build after the kernel Image is ready."
          fi

          DROIDSPACES_CONFIG=""
          if [[ "${{ inputs.droidspaces }}" == true ]]; then

            apply_droidspaces_patch() {
              local patch_file="$1" label="$2"
              if patch -p1 -N --fuzz=0 --dry-run --silent < "$patch_file" > /dev/null 2>&1; then
                patch -p1 -N --fuzz=0 < "$patch_file"
                echo "==> DroidSpaces ${label}: applied."
                return 0
              elif patch -p1 -R --fuzz=0 --dry-run --silent < "$patch_file" > /dev/null 2>&1; then
                echo "==> DroidSpaces ${label}: already present natively on this branch (confirmed via reverse-check) - not re-applying."
                return 0
              else
                echo "::warning::DroidSpaces ${label} doesn't apply cleanly in either direction - can't confirm the kABI fix is actually present on this tree."
                return 1
              fi
            }

            DROIDSPACES_SAFE=true

            curl -sLo patch-for-below-6.12.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
            apply_droidspaces_patch patch-for-below-6.12.patch "patch 001 (sysvipc kabi fix)" || DROIDSPACES_SAFE=false

            curl -sLo patch-for-5.10-or-lower.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch
            apply_droidspaces_patch patch-for-5.10-or-lower.patch "patch 002 (posix_mqueue abi padding)" || DROIDSPACES_SAFE=false

            if [[ "$DROIDSPACES_SAFE" == true ]]; then
              if [[ -f "${GITHUB_WORKSPACE}/configs/droidspaces-gki.config" ]]; then
                cp ${GITHUB_WORKSPACE}/configs/droidspaces-gki.config arch/arm64/configs/vendor/droidspaces.config
                DROIDSPACES_CONFIG="vendor/droidspaces.config"
              else
                echo "::warning::configs/droidspaces-gki.config not found in this repo's root - DroidSpaces config fragment not applied (nothing to enable it with). Add that file to the repo (see ravindu644/Droidspaces-OSS 'Configuring GKI Kernels' docs) to actually turn DroidSpaces on."
              fi
            else
              echo "::warning::Skipping the DroidSpaces config fragment entirely this run - at least one required kABI patch could not be confirmed. Enabling CONFIG_SYSVIPC/CONFIG_IPC_NS/CONFIG_POSIX_MQUEUE without it risks a bootloop per DroidSpaces-OSS's own docs, so this run won't have working DroidSpaces support."
            fi
          fi

          echo "-${KERNEL_NAME}-${{ github.actor }}" > .scmversion

          echo "CONFIG_TMPFS_XATTR=y" >> arch/arm64/configs/gki_defconfig

          make O=out gki_defconfig vendor/waipio_GKI.config vendor/xiaomi_GKI.config vendor/ingres_GKI.config vendor/debugfs.config ${DROIDSPACES_CONFIG}

          echo "::group::Sanity-check defconfig (savedefconfig)"

          make O=out savedefconfig
          cp out/defconfig "${GITHUB_WORKSPACE}/resolved_defconfig.txt"

          echo "--- Cek symbol kunci ingres / tuning gaming tetap ke-resolve ---"
          for cfg in \
            CONFIG_ARCH_QCOM \
            CONFIG_ARCH_WAIPIO \
            CONFIG_SCHED_WALT \
            CONFIG_QCOM_KGSL \
            CONFIG_BINDER_PRIO \
            CONFIG_MQ_IOSCHED_KYBER \
            CONFIG_MQ_IOSCHED_DEADLINE \
            CONFIG_HZ_500 \
            CONFIG_KSU_SUSFS \
            CONFIG_BBG \
            CONFIG_REKERNEL \
            CONFIG_NOMOUNT \
          ; do
            hit=$(grep "^${cfg}=" out/defconfig || true)
            if [[ -n "$hit" ]]; then
              echo "✅ ${hit}"
            else
              echo "⚠️  ${cfg} tidak ada di hasil resolve (dependency belum kepenuhi, atau symbol memang gak ada di tree ini - cek manual kalau ini config yang kamu harap ada)"
            fi
          done
          echo "::endgroup::"

          
          make -j$(nproc) O=out CC="ccache ${CLANG_ROOT}/clang" HOSTCC="ccache ${CLANG_ROOT}/clang" Image

          echo "ccache status after build:"
          ccache -s

      - name: Save ccache
        if: ${{ always() && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ inputs.kernel_branch }}

      - name: Upload resolved defconfig (debug artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resolved-defconfig-${{ inputs.ksu_type }}
          path: resolved_defconfig.txt
          if-no-files-found: warn

      - name: Upload SuSFS patch rejects (debug artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: susfs-patch-rejects-${{ inputs.ksu_type }}
          path: ${{ env.SOC }}/**/*.rej
          if-no-files-found: ignore

      - name: Build Re-Kernel (eBPF)
        if: ${{ inputs.rekernel_ebpf }}
        run: |
          set -e

          
          mkdir -p rekernel-ebpf-build
          cd rekernel-ebpf-build

          
          curl -sSL -o bpftool.tar.gz \
            https://github.com/libbpf/bpftool/releases/download/v7.5.0/bpftool-v7.5.0-amd64.tar.gz
          mkdir -p bpftool-bin
          tar -xzf bpftool.tar.gz -C bpftool-bin
          chmod +x bpftool-bin/bpftool

          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip

          # ---- Fetch only the eBPF-Source subfolder from Re-Kernel ----
          git clone --depth=1 --recurse-submodules --shallow-submodules --filter=blob:none --sparse \
            https://github.com/Sakion-Team/Re-Kernel.git rekernel-ebpf-src
          cd rekernel-ebpf-src
          git sparse-checkout set eBPF-Source
          cd eBPF-Source


          "${GITHUB_WORKSPACE}/rekernel-ebpf-build/bpftool-bin/bpftool" btf dump file \
            "${GITHUB_WORKSPACE}/${SOC}/out/vmlinux" format c > include/vmlinux.h

          NDK_PATH="${GITHUB_WORKSPACE}/rekernel-ebpf-build/android-ndk-r27d"

          if ! make ARCH=aarch64 API=35 NDK_PATH="${NDK_PATH}"; then
            echo "::warning::Re-Kernel eBPF build failed with plain vmlinux.h — retrying with EXTRA_BPF_CFLAGS=-DRK_DEFINE_BINDER_TYPES (binder structs may be missing from our BTF dump)."
            make clean
            make ARCH=aarch64 API=35 NDK_PATH="${NDK_PATH}" EXTRA_BPF_CFLAGS=-DRK_DEFINE_BINDER_TYPES
          fi

          mkdir -p "${GITHUB_WORKSPACE}/rekernel-ebpf-out"
          cp out/rekernel.bpf.o "${GITHUB_WORKSPACE}/rekernel-ebpf-out/"
          cp out/rekerneld_aarch64 "${GITHUB_WORKSPACE}/rekernel-ebpf-out/"

      - name: Make AnyKernel3
        run: |
          ZIP_NAME="${KERNEL_NAME}_${{ inputs.ksu_type }}"

          if [[ "${{ inputs.susfs }}" == true ]]; then
            ZIP_NAME="${ZIP_NAME}_SuSFS"
          fi

          if [[ "${{ inputs.nomount }}" == true ]]; then
            ZIP_NAME="${ZIP_NAME}_NoMount"
          fi

          ZIP_NAME="${ZIP_NAME}_$(date -u +"%Y%m%d_%H%M")"
          git clone --recurse-submodules https://github.com/kingD2N/AnyKernel3.git

          cp ${SOC}/out/arch/arm64/boot/Image AnyKernel3/Image
          cp ${SOC}/out/arch/arm64/boot/Image ./Image
          cd AnyKernel3

          zip -r9 ../"${ZIP_NAME}.zip" * -x .git

      - name: Create GitHub Release
        run: |
          BUILD_TIME=$(date -u +"%Y%m%d_%H%M")
          REL_NAME="${KERNEL_NAME}-${BUILD_TIME}"
          echo "REL_NAME=${REL_NAME}" >> $GITHUB_ENV
          cd ${GITHUB_WORKSPACE}
          ZIP_FILE=$(ls *.zip)

          ASSETS=("${ZIP_FILE}")
          if [[ "${{ inputs.rekernel_ebpf }}" == true ]]; then
            ASSETS+=("rekernel-ebpf-out/rekernel.bpf.o" "rekernel-ebpf-out/rekerneld_aarch64")
          fi

          if [[ "${{ inputs.susfs }}" == true ]]; then
            susfs_checkbox="Supported (susfs4ksu@${SUSFS_COMMIT})"
          else
            susfs_checkbox="Unsupported"
          fi

          if [[ "${{ inputs.BBG }}" == true ]]; then
            bbg_checkbox="Supported"
          else
            bbg_checkbox="Unsupported"
          fi

          if [[ "${{ inputs.rekernel_netlink }}" == true ]]; then
            rekernel_netlink_checkbox="Supported"
          else
            rekernel_netlink_checkbox="Unsupported"
          fi

          if [[ "${{ inputs.rekernel_ebpf }}" == true ]]; then
            rekernel_ebpf_checkbox="Supported (daemon+prog attached as release assets)"
          else
            rekernel_ebpf_checkbox="Unsupported"
          fi

          if [[ "${{ inputs.droidspaces }}" == true ]]; then
            droidspaces_checkbox="Supported"
          else
            droidspaces_checkbox="Unsupported"
          fi

          if [[ "${{ inputs.nomount }}" == true ]]; then
            nomount_checkbox="Supported (maxsteeel/nomount@master@${NOMOUNT_COMMIT})"
          else
            nomount_checkbox="Unsupported"
          fi

          cat > release_notes.md << NOTES_EOF
          #

          <img width="512" height="279" alt="image_0c69b253-1d7c-4fda-9f53-08ba18f46a10" src="https://github.com/user-attachments/assets/ba10704d-00c8-45d1-bde0-bd8bdb3618d2" />

          | | |
          |:---|:---|
          | 📱 Device | POCO F4 GT (ingres) • Redmi K50G (ingres) |
          | 🟠 ROM Support | Official AOSP |
          | 🖥️ Kernel Name | ${KERNEL_NAME} |
          | 🧬 Kernel Base | ${KERNEL_BASE} |
          | 🛠️ Build Scope | ZIP |
          | 📦 Source | ${{ inputs.kernel_source }} |
          | ⚔️ Kernel branch | ${{ inputs.kernel_branch }} |
          | 💻 KSU Manager type | ${{ inputs.ksu_type }} |
          | 🔧 SuSFS Version | ${susfs_checkbox} |
          | ⚙️ BBG Patch | ${bbg_checkbox} |
          | ⚙️ Re-Kernel (Netlink) | ${rekernel_netlink_checkbox} |
          | ⚙️ Re-Kernel (eBPF) | ${rekernel_ebpf_checkbox} |
          | 🧩 DroidSpaces | ${droidspaces_checkbox} |
          | 🗂️ NoMount | ${nomount_checkbox} |
          | 🔨 Compiler | LLVM/Clang ${LLVM_VERSION} Official |

          ---
          NOTES_EOF

          gh release create "$REL_NAME" --title "$REL_NAME" --notes-file release_notes.md "${ASSETS[@]}"
