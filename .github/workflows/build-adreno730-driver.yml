                  die("Layout source tidak dikenali: libGLESv2_adreno.so harus ada di lib64/egl, vendor/lib64/egl "
                      "atau system/vendor/lib64/egl. Ditemukan: " + (", ".join(cand) or "(tidak ada file adreno)"))
              return max(roots.items(), key=lambda kv: kv[1])[0]


          # ----------------------------------------------------------------------------
          # ELF
          # ----------------------------------------------------------------------------
          def elf_info(data):
              """(bits, machine, needed[]) atau None bila bukan ELF."""
              if data[:4] != b"\x7fELF" or len(data) < 52:
                  return None
              bits = 64 if data[4] == 2 else 32
              if bits == 64 and len(data) < 64:
                  return None
              e = "<" if data[5] == 1 else ">"
              machine = struct.unpack_from(e + "H", data, 18)[0]
              needed = []
              try:
                  if bits == 64:
                      phoff = struct.unpack_from(e + "Q", data, 32)[0]
                      phentsize, phnum = struct.unpack_from(e + "HH", data, 54)
                  else:
                      phoff = struct.unpack_from(e + "I", data, 28)[0]
                      phentsize, phnum = struct.unpack_from(e + "HH", data, 42)
                  loads, dyn = [], None
                  for i in range(phnum):
                      o = phoff + i * phentsize
                      if bits == 64:
                          p_type, _f, p_off, p_vaddr, _pa, p_filesz, _ms, _al = struct.unpack_from(e + "IIQQQQQQ", data, o)
                      else:
                          p_type, p_off, p_vaddr, _pa, p_filesz, _ms, _f, _al = struct.unpack_from(e + "IIIIIIII", data, o)
                      if p_type == 1:
                          loads.append((p_vaddr, p_off, p_filesz))
                      elif p_type == 2:
                          dyn = (p_off, p_filesz)
                  if dyn:
                      esz = 16 if bits == 64 else 8
                      fmt = e + ("QQ" if bits == 64 else "II")
                      strtab, names = None, []
                      for o in range(dyn[0], dyn[0] + dyn[1], esz):
                          tag, val = struct.unpack_from(fmt, data, o)
                          if tag == 0:
                              break
                          if tag == 1:
                              names.append(val)
                          elif tag == 5:
                              strtab = val
                      if strtab is not None:
                          off = None
                          for va, po, fs in loads:
                              if va <= strtab < va + fs:
                                  off = po + (strtab - va)
                                  break
                          if off is not None:
                              for n in names:
                                  end = data.index(b"\x00", off + n)
                                  needed.append(data[off + n:end].decode("ascii", "replace"))
              except (struct.error, ValueError):
                  pass
              return bits, machine, needed


          # ----------------------------------------------------------------------------
          # XML
          # ----------------------------------------------------------------------------
          def sanitize_xml(raw, name):
              notes = []
              if raw[:2] in (b"\xff\xfe", b"\xfe\xff"):
                  text = raw.decode("utf-16")
                  notes.append("UTF-16 -> UTF-8")
              elif raw[:3] == b"\xef\xbb\xbf":
                  text = raw[3:].decode("utf-8", "replace")
                  notes.append("BOM dibuang")
              elif b"\x00" in raw[:4] and raw[:1] != b"\x00" and raw[1:2] == b"\x00":
                  text = raw.decode("utf-16-le", "replace")
                  notes.append("UTF-16LE tanpa BOM -> UTF-8")
              elif raw[:1] == b"\x00":
                  text = raw.decode("utf-16-be", "replace")
                  notes.append("UTF-16BE tanpa BOM -> UTF-8")
              else:
                  text = raw.decode("utf-8", "replace")
              if "\x00" in text:
                  text = text.replace("\x00", "")
                  notes.append("byte NUL dibuang")
              if "﻿" in text:
                  text = text.replace("﻿", "")
              text = text.replace("\r\n", "\n").replace("\r", "\n").lstrip()
              decl = re.match(r"<\?xml[^>]*\?>", text)
              want = '<?xml version="1.0" encoding="utf-8"?>'
              if decl:
                  if decl.group(0) != want:
                      text = want + text[decl.end():]
                      notes.append("deklarasi XML dinormalkan")
              else:
                  text = want + "\n" + text
                  notes.append("deklarasi XML ditambahkan")
              if not text.endswith("\n"):
                  text += "\n"
              data = text.encode("utf-8")
              try:
                  root = ET.fromstring(data)
              except ET.ParseError as ex:
                  die(f"XML rusak dan tidak bisa diperbaiki: {name}: {ex}")
              if "permissions" in name and root.tag != "permissions":
                  warn(f"{name}: root XML '{root.tag}', biasanya <permissions>")
              return data, notes


