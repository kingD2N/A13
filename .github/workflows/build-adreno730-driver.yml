                          root = base.joinpath(*rel[:j]) if j > 0 else base
                          roots[root] = roots.get(root, 0) + 1
                          break
                  else:
                      # layout flat (zip TWRP): lib/egl atau lib64/egl langsung di root arsip
                      if len(rel) >= 3 and rel[-2] == "egl" and rel[-3] in ("lib", "lib64"):
                          root = base.joinpath(*rel[:-3]) if len(rel) > 3 else base
                          roots[root] = roots.get(root, 0) + 1
              if not roots:
