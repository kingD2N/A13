# =============================================================================
#  Adreno 730 GPU Driver - POCO F4 GT (ingres) - AOSP Android 16 QPR2
#  by kingD2N
#
#  Hasil rilis:
#    *_Module.zip  -> flash lewat manager (KernelSU-Next / SukiSU / Magisk / MMRL)
#    *_TWRP.zip    -> flash lewat TWRP / OrangeFox (pasang ke /data/adb/modules)
#
#  Cara pakai (dari HP):
#    Actions -> "Build Adreno 730 GPU Driver (ingres)" -> Run workflow
#    Isi src_url (link zip driver 837.0.9: GitHub Release / GDrive / Mega) atau src_path.
#    Run pertama: matikan publish_release untuk uji dulu (zip ada di Artifacts).
# =============================================================================
name: Build Adreno 730 GPU Driver (ingres)

on:
  workflow_dispatch:
    inputs:
      driver_version:
        description: 'Versi driver Adreno'
        required: true
        default: '837.0.9'
      src_url:
        description: 'Link source driver (direct / Google Drive / Mega). Kosongkan jika pakai src_path'
        required: false
        default: ''
      src_sha256:
        description: 'SHA256 file source (opsional, verifikasi unduhan)'
        required: false
        default: ''
      src_path:
        description: 'Alternatif: path file/folder source di repo ini'
        required: false
        default: ''
      tree_branch:
        description: 'Branch Tree_ingres'
        required: false
        default: 'Ingres_tree'
      include_firmware:
        description: 'Ikutkan firmware A730 dari source (eksperimental, default pakai stock ROM)'
        type: boolean
        default: false
      extra_blocklist:
        description: 'Tambahan file yang TIDAK dipasang (nama/glob, pisah spasi/koma)'
        required: false
        default: ''
      publish_release:
        description: 'Buat GitHub Release'
        type: boolean
        default: true
      prerelease:
        description: 'Tandai sebagai pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  TREE_REPO: kingD2N/Tree_ingres

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build driver Adreno 730
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repo ini
        uses: actions/checkout@v4

      - name: Checkout Tree_ingres (hanya file KGSL / GPU)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TREE_REPO }}
          ref: ${{ inputs.tree_branch }}
          token: ${{ secrets.TREE_TOKEN || github.token }}
          path: tree
          fetch-depth: 1
          sparse-checkout: |
            /Makefile
            /include/uapi/linux/msm_kgsl.h
            /drivers/gpu/msm/adreno-gpulist.h
            /arch/arm64/configs/vendor/*.config
          sparse-checkout-cone-mode: false

      - name: Validasi input
        env:
          DRIVER_VERSION: ${{ inputs.driver_version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DRIVER_VERSION" | grep -qE '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::driver_version tidak valid: '$DRIVER_VERSION' (contoh 837.0.9)"
            exit 1
          fi

      - name: Tulis skrip packager
        run: |
          set -euo pipefail
          mkdir -p ax/scripts ax/tpl
          cat > ax/scripts/kgsl_facts.py <<'__AX_EOF_KGSL_FACTS__'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """Ambil fakta KGSL / Adreno 730 dari Tree_ingres (kernel source ingres).

          Dipakai untuk: (1) laporan kompatibilitas di release notes, (2) daftar firmware
          yang diminta kernel (a730_sqe.fw, gmu_gen70000.bin, a730_zap) supaya packager
          bisa mengecek isi source driver.

          Pemakaian: kgsl_facts.py <tree_dir> <out_dir>
          """
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          if len(sys.argv) != 3:
              sys.exit("usage: kgsl_facts.py <tree_dir> <out_dir>")

          tree = Path(sys.argv[1])
          out = Path(sys.argv[2])
          out.mkdir(parents=True, exist_ok=True)

          A730_CHIPIDS = {"0x07030000": "primary (SM8450 / ingres)", "0x07030001": "varian v2"}


          def die(msg):
              print(f"::error::{msg}")
              sys.exit(1)


          def read(rel):
              p = tree / rel
              if not p.is_file():
                  die(f"{rel} tidak ada di Tree_ingres (branch salah atau sparse-checkout gagal)")
              return p.read_text(errors="replace")


          # --- versi kernel --------------------------------------------------------
          mk = read("Makefile")
          parts = []
          for key in ("VERSION", "PATCHLEVEL", "SUBLEVEL"):
              m = re.search(rf"^{key}\s*=\s*(\d+)", mk, re.M)
              parts.append(m.group(1) if m else "?")
          kernel_version = ".".join(parts)

          # --- versi UAPI KGSL -------------------------------------------------------
          uapi = read("include/uapi/linux/msm_kgsl.h")
          vmaj = re.search(r"#define\s+KGSL_VERSION_MAJOR\s+(\d+)", uapi)
          vmin = re.search(r"#define\s+KGSL_VERSION_MINOR\s+(\d+)", uapi)
          if not (vmaj and vmin):
              die("KGSL_VERSION_MAJOR/MINOR tidak ditemukan di msm_kgsl.h")
          kgsl_uapi = f"{vmaj.group(1)}.{vmin.group(1)}"

          # --- entri Adreno 730 di adreno-gpulist.h ----------------------------------
          gl = read("drivers/gpu/msm/adreno-gpulist.h")
          cores = []
          for m in re.finditer(r"static const struct adreno_gen7_core (\w+) = \{(.*?)\n\};", gl, re.S):
              name, body = m.group(1), m.group(2)
              cid = re.search(r"\.chipid\s*=\s*(0x[0-9a-fA-F]+)", body)
              if not cid:
                  continue
              chipid = "0x%08x" % int(cid.group(1), 16)
              if chipid not in A730_CHIPIDS:
                  continue

              def field(pat, body=body):
                  f = re.search(pat, body)
                  return f.group(1) if f else None

              gmuv = re.search(r"GMU_VERSION\((\d+),\s*(\d+),\s*(\d+)\)", body)
              cores.append({
                  "name": name.replace("adreno_gpu_core_", ""),
                  "chipid": chipid,
                  "note": A730_CHIPIDS[chipid],
                  "compatible": field(r'\.compatible\s*=\s*"([^"]+)"'),
                  "sqe_fw": field(r'\.sqefw_name\s*=\s*"([^"]+)"'),
                  "gmu_fw": field(r'\.gmufw_name\s*=\s*"([^"]+)"'),
                  "gmu_fw_bak": field(r'\.gmufw_bak_name\s*=\s*"([^"]+)"'),
                  "zap": field(r'\.zap_name\s*=\s*"([^"]+)"'),
                  "gmu_fw_version": ".".join(gmuv.groups()) if gmuv else None,
              })
          if not cores:
              die("Adreno 730 (chipid 0x07030000/0x07030001) tidak ada di adreno-gpulist.h")

          # --- status CONFIG_QCOM_KGSL di config waipio/ingres ------------------------
          configs = {}
          cfgdir = tree / "arch/arm64/configs/vendor"
          if cfgdir.is_dir():
              for f in sorted(cfgdir.glob("*.config")):
                  if not re.search(r"waipio|ingres", f.name):
                      continue
                  hits = []
                  for line in f.read_text(errors="replace").splitlines():
                      if re.match(r"^(# )?CONFIG_(QCOM_KGSL|DEVFREQ_GOV_QCOM_ADRENO_TZ|QCOM_ADRENO_DEFAULT_GOVERNOR)", line):
                          hits.append(line.strip())
                  if hits:
                      configs[f.name] = hits

          # --- commit tree -----------------------------------------------------------
          sha = os.environ.get("TREE_SHA", "")
          if not sha:
              try:
                  sha = subprocess.run(["git", "-C", str(tree), "rev-parse", "HEAD"],
                                       capture_output=True, text=True, check=True).stdout.strip()
              except Exception:
                  sha = "unknown"

          primary = next((c for c in cores if c["chipid"] == "0x07030000"), cores[0])
          fw_names = sorted({v for c in cores for v in (c["sqe_fw"], c["gmu_fw"], c["gmu_fw_bak"]) if v})
          zap_names = sorted({c["zap"] for c in cores if c["zap"]})

          facts = {
              "tree": {
                  "repo": os.environ.get("TREE_REPO", ""),
                  "branch": os.environ.get("TREE_BRANCH", ""),
                  "commit": sha,
              },
              "kernel_version": kernel_version,
              "kgsl_uapi": kgsl_uapi,
              "primary_core": primary["name"],
              "cores": cores,
              "firmware_required": fw_names,
              "zap_required": zap_names,
              "kgsl_configs": configs,
          }
          (out / "kgsl-compat.json").write_text(json.dumps(facts, indent=2, ensure_ascii=False) + "\n")

          md = [
              "| Item | Nilai |",
              "|---|---|",
              f"| Tree | `{facts['tree']['repo']}` @ `{facts['tree']['branch']}` (`{sha[:9]}`) |",
              f"| Kernel | Linux {kernel_version} (msm-kernel, GKI) |",
              f"| KGSL UAPI | {kgsl_uapi} |",
          ]
          for c in cores:
              md.append(f"| Core `{c['name']}` | chipid `{c['chipid']}` ({c['note']}), dt `{c['compatible']}`, GMU fw v{c['gmu_fw_version']} |")
          md.append(f"| Firmware diminta kernel | `{'`, `'.join(fw_names + zap_names)}` |")
          (out / "kgsl-compat.md").write_text("\n".join(md) + "\n")

          print(f"KGSL UAPI {kgsl_uapi} | kernel {kernel_version} | core utama {primary['name']} ({primary['chipid']})")
          print("firmware diminta kernel:", ", ".join(fw_names + zap_names))

          gh = os.environ.get("GITHUB_OUTPUT")
          if gh:
              with open(gh, "a") as fh:
                  fh.write(f"kgsl_uapi={kgsl_uapi}\n")
                  fh.write(f"kernel_version={kernel_version}\n")
          __AX_EOF_KGSL_FACTS__

          cat > ax/scripts/fetch_source.sh <<'__AX_EOF_FETCH_SOURCE__'
          #!/usr/bin/env bash
          # Ambil source driver Adreno (SRC_PATH di repo ini, atau SRC_URL) ke folder dl/
          # Env: SRC_URL, SRC_PATH, SRC_SHA256
          set -euo pipefail

          rm -rf dl && mkdir -p dl

          if [ -n "${SRC_PATH:-}" ]; then
            [ -e "$SRC_PATH" ] || { echo "::error::src_path tidak ditemukan di repo: $SRC_PATH"; exit 1; }
            cp -a "$SRC_PATH" dl/
            echo "Source dari repo: $SRC_PATH"
          elif [ -n "${SRC_URL:-}" ]; then
            case "$SRC_URL" in
              https://*|http://*) ;;
              *) echo "::error::src_url harus diawali http(s)://"; exit 1 ;;
            esac
            case "$SRC_URL" in
              *drive.google.com*|*docs.google.com*)
                echo "Unduh via gdown (Google Drive)"
                python3 -m pip install --quiet --break-system-packages gdown || python3 -m pip install --quiet gdown
                python3 -m gdown --fuzzy "$SRC_URL" -O dl/
                ;;
              *mega.nz*|*mega.co.nz*)
                echo "Unduh via megatools (Mega)"
                sudo apt-get update -qq && sudo apt-get install -y -qq megatools >/dev/null
                megadl --path dl "$SRC_URL"
                ;;
              *)
                echo "Unduh via curl"
                curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 1200 \
                  -A 'Mozilla/5.0 (X11; Linux x86_64)' -o dl/source.download "$SRC_URL"
                ;;
            esac
          else
            echo "::error::Isi src_url (link driver 837.0.9) atau src_path (file di repo ini)."
            echo "::error::Link XDA butuh login, jadi upload dulu ke GitHub Release / GDrive / Mega lalu tempel link-nya."
            exit 1
          fi

          # Tolak halaman HTML (login / captcha / link kedaluwarsa)
          for f in dl/*; do
            [ -f "$f" ] || continue
            if [ "$(head -c 512 "$f" | tr -d '\0' | grep -ciE '<!doctype html|<html' || true)" -gt 0 ]; then
              echo "::error::$(basename "$f") adalah halaman HTML, bukan file driver (link butuh login / kedaluwarsa?)."
              exit 1
            fi
          done

          n="$(find dl -mindepth 1 | wc -l)"
          [ "$n" -gt 0 ] || { echo "::error::Tidak ada file yang terunduh."; exit 1; }

          echo "Isi dl/:"
          ls -la dl
          for f in dl/*; do
            [ -f "$f" ] || continue
            sum="$(sha256sum "$f" | cut -d' ' -f1)"
            echo "sha256 $(basename "$f") = $sum"
            if [ -n "${SRC_SHA256:-}" ]; then
              want="$(printf '%s' "$SRC_SHA256" | tr 'A-F' 'a-f' | tr -d '[:space:]')"
              if [ "$sum" != "$want" ]; then
                echo "::error::SHA256 tidak cocok. diharapkan=$want didapat=$sum"
                exit 1
              fi
              echo "SHA256 cocok."
            fi
          done
          __AX_EOF_FETCH_SOURCE__

          cat > ax/scripts/adreno_pack.py <<'__AX_EOF_ADRENO_PACK__'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """ax_adreno_pack - rakit driver Adreno 730 (ingres) jadi:
            * modul KernelSU/Magisk/SukiSU      -> flash dari manager
            * zip recovery (TWRP / OrangeFox)   -> memasang modul ke /data/adb/modules

            adreno_pack.py pack   --src PATH --version 837.0.9 --tpl tpl --out out [--facts out/kgsl-compat.json]
            adreno_pack.py verify --out out
          """
          import argparse
          import fnmatch
          import hashlib
          import json
          import os
          import re
          import shutil
          import struct
          import subprocess
          import sys
          import tarfile
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          MODULE_ID = "ax_adreno730_driver"
          # Terbukti bootloop di AxionOS QPR2 -> selalu pakai versi stock ROM
          DEFAULT_BLOCKLIST = [
              "gpu++.so",
              "libgpumemtracer.so",
              "libgpuservice.so",
              "libmapperutils.so",
              "vendor.qti.hardware.hexlp-V2-ndk.so",
          ]
          ZIP_DATE = (2026, 1, 1, 0, 0, 0)
          WARNINGS = []


          def die(msg):
              print(f"::error::{msg}")
              sys.exit(1)


          def warn(msg):
              WARNINGS.append(msg)
              print(f"::warning::{msg}")


          def sha256_bytes(b):
              return hashlib.sha256(b).hexdigest()


          def sha256_file(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()


          # ----------------------------------------------------------------------------
          # ekstraksi
          # ----------------------------------------------------------------------------
          def detect_kind(p):
              with open(p, "rb") as f:
                  head = f.read(600)
              if head[:4] in (b"PK\x03\x04", b"PK\x05\x06"):
                  return "zip"
              if head[:6] == b"7z\xbc\xaf\x27\x1c":
                  return "7z"
              if head[:2] == b"\x1f\x8b" or head[:6] == b"\xfd7zXZ\x00" or head[:3] == b"BZh":
                  return "tar"
              if head[257:262] == b"ustar":
                  return "tar"
              return None


          def safe_join(root, name):
              dest = (root / name).resolve()
              if root.resolve() not in dest.parents and dest != root.resolve():
                  die(f"path berbahaya di arsip: {name}")
              return dest


          def extract_archive(p, kind, dst):
              dst.mkdir(parents=True, exist_ok=True)
              if kind == "zip":
                  with zipfile.ZipFile(p) as zf:
                      for info in zf.infolist():
                          if info.filename.startswith("__MACOSX/"):
                              continue
                          dest = safe_join(dst, info.filename)
                          if info.is_dir():
                              dest.mkdir(parents=True, exist_ok=True)
                              continue
                          dest.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(info) as s, open(dest, "wb") as d:
                              shutil.copyfileobj(s, d)
              elif kind == "tar":
                  with tarfile.open(p) as tf:
                      for m in tf.getmembers():
                          safe_join(dst, m.name)
                          if m.issym() or m.islnk() or m.isdev():
                              warn(f"link/device di tar diabaikan: {m.name}")
                              continue
                          tf.extract(m, dst)
              elif kind == "7z":
                  r = subprocess.run(["7z", "x", "-y", f"-o{dst}", str(p)], capture_output=True, text=True)
                  if r.returncode != 0:
                      die(f"7z gagal: {r.stdout[-400:]} {r.stderr[-400:]}")
              else:
                  die(f"format arsip tidak didukung: {p}")


          def materialize(src, work):
              """Kembalikan folder hasil ekstraksi dari src (file arsip atau folder)."""
              src = Path(src)
              base = work / "src"
              if base.exists():
                  shutil.rmtree(base)
              base.mkdir(parents=True)
              if src.is_dir():
                  shutil.copytree(src, base, dirs_exist_ok=True, symlinks=False)
              else:
                  kind = detect_kind(src)
                  if not kind:
                      die(f"{src.name}: bukan zip/tar/7z. Format lain (img, rar) belum didukung.")
                  extract_archive(src, kind, base)
              return base


          def expand_nested(base, depth=2):
              """Jika belum ada libGLESv2_adreno.so, buka arsip di dalam arsip (mis. release zip berisi module zip)."""
              for _ in range(depth):
                  if any(base.rglob("libGLESv2_adreno.so")):
                      return
                  found = False
                  for f in sorted(base.rglob("*")):
                      if f.is_file() and not f.name.endswith(".so"):
                          kind = detect_kind(f)
                          if kind:
                              print(f"buka arsip bersarang: {f.relative_to(base)}")
                              extract_archive(f, kind, f.with_name(f.name + "_x"))
                              f.unlink()
                              found = True
                  if not found:
                      return


          def find_root(base):
              roots = {}
              for p in base.rglob("libGLESv2_adreno.so"):
                  rel = p.relative_to(base).parts
                  for i in range(len(rel) - 1, -1, -1):
                      if rel[i] == "vendor":
                          j = i - 1 if i > 0 and rel[i - 1] == "system" else i
                          root = base.joinpath(*rel[:j]) if j > 0 else base
                          roots[root] = roots.get(root, 0) + 1
                          break
              if not roots:
                  cand = [str(p.relative_to(base)) for p in base.rglob("*adreno*.so")][:15]
                  die("Layout source tidak dikenali: libGLESv2_adreno.so harus ada di vendor/lib64/egl atau "
                      "system/vendor/lib64/egl. Ditemukan: " + (", ".join(cand) or "(tidak ada file adreno)"))
              return max(roots.items(), key=lambda kv: kv[1])[0]


          # ----------------------------------------------------------------------------
          # ELF
          # ----------------------------------------------------------------------------
          def elf_info(data):
              """(bits, machine, needed[]) atau None bila bukan ELF."""
              if data[:4] != b"\x7fELF" or len(data) < 52:
                  return None
              bits = 64 if data[4] == 2 else 32
              if bits == 64 and len(data) < 64:
                  return None
              e = "<" if data[5] == 1 else ">"
              machine = struct.unpack_from(e + "H", data, 18)[0]
              needed = []
              try:
                  if bits == 64:
                      phoff = struct.unpack_from(e + "Q", data, 32)[0]
                      phentsize, phnum = struct.unpack_from(e + "HH", data, 54)
                  else:
                      phoff = struct.unpack_from(e + "I", data, 28)[0]
                      phentsize, phnum = struct.unpack_from(e + "HH", data, 42)
                  loads, dyn = [], None
                  for i in range(phnum):
                      o = phoff + i * phentsize
                      if bits == 64:
                          p_type, _f, p_off, p_vaddr, _pa, p_filesz, _ms, _al = struct.unpack_from(e + "IIQQQQQQ", data, o)
                      else:
                          p_type, p_off, p_vaddr, _pa, p_filesz, _ms, _f, _al = struct.unpack_from(e + "IIIIIIII", data, o)
                      if p_type == 1:
                          loads.append((p_vaddr, p_off, p_filesz))
                      elif p_type == 2:
                          dyn = (p_off, p_filesz)
                  if dyn:
                      esz = 16 if bits == 64 else 8
                      fmt = e + ("QQ" if bits == 64 else "II")
                      strtab, names = None, []
                      for o in range(dyn[0], dyn[0] + dyn[1], esz):
                          tag, val = struct.unpack_from(fmt, data, o)
                          if tag == 0:
                              break
                          if tag == 1:
                              names.append(val)
                          elif tag == 5:
                              strtab = val
                      if strtab is not None:
                          off = None
                          for va, po, fs in loads:
                              if va <= strtab < va + fs:
                                  off = po + (strtab - va)
                                  break
                          if off is not None:
                              for n in names:
                                  end = data.index(b"\x00", off + n)
                                  needed.append(data[off + n:end].decode("ascii", "replace"))
              except (struct.error, ValueError):
                  pass
              return bits, machine, needed


          # ----------------------------------------------------------------------------
          # XML
          # ----------------------------------------------------------------------------
          def sanitize_xml(raw, name):
              notes = []
              if raw[:2] in (b"\xff\xfe", b"\xfe\xff"):
                  text = raw.decode("utf-16")
                  notes.append("UTF-16 -> UTF-8")
              elif raw[:3] == b"\xef\xbb\xbf":
                  text = raw[3:].decode("utf-8", "replace")
                  notes.append("BOM dibuang")
              elif b"\x00" in raw[:4] and raw[:1] != b"\x00" and raw[1:2] == b"\x00":
                  text = raw.decode("utf-16-le", "replace")
                  notes.append("UTF-16LE tanpa BOM -> UTF-8")
              elif raw[:1] == b"\x00":
                  text = raw.decode("utf-16-be", "replace")
                  notes.append("UTF-16BE tanpa BOM -> UTF-8")
              else:
                  text = raw.decode("utf-8", "replace")
              if "\x00" in text:
                  text = text.replace("\x00", "")
                  notes.append("byte NUL dibuang")
              if "﻿" in text:
                  text = text.replace("﻿", "")
              text = text.replace("\r\n", "\n").replace("\r", "\n").lstrip()
              decl = re.match(r"<\?xml[^>]*\?>", text)
              want = '<?xml version="1.0" encoding="utf-8"?>'
              if decl:
                  if decl.group(0) != want:
                      text = want + text[decl.end():]
                      notes.append("deklarasi XML dinormalkan")
              else:
                  text = want + "\n" + text
                  notes.append("deklarasi XML ditambahkan")
              if not text.endswith("\n"):
                  text += "\n"
              data = text.encode("utf-8")
              try:
                  root = ET.fromstring(data)
              except ET.ParseError as ex:
                  die(f"XML rusak dan tidak bisa diperbaiki: {name}: {ex}")
              if "permissions" in name and root.tag != "permissions":
                  warn(f"{name}: root XML '{root.tag}', biasanya <permissions>")
              return data, notes


          # ----------------------------------------------------------------------------
          # aturan: file mana yang dipasang
          # ----------------------------------------------------------------------------
          def decide(rel, blocklist, extra_allow, fw_ok):
              name = rel.rsplit("/", 1)[-1]
              if any(fnmatch.fnmatch(name, pat) for pat in blocklist):
                  return "skip", "blocklist (bootloop AxionOS QPR2 -> pakai stock ROM)"
              if any(fnmatch.fnmatch(rel, pat) for pat in extra_allow):
                  return "keep", "extra_allow"
              if rel.startswith("vendor/firmware/"):
                  if name in fw_ok:
                      return "keep", "firmware A730 (include_firmware)"
                  return "skip", "firmware: dimatikan atau bukan fw A730 yang diminta kernel"
              m = re.match(r"vendor/lib(64)?/(.*)$", rel)
              if m:
                  sub = m.group(2)
                  if sub.startswith("hw/"):
                      if re.fullmatch(r"hw/vulkan\.[A-Za-z0-9_]+\.so", sub):
                          return "keep", "HAL Vulkan"
                      return "skip", "HAL selain vulkan (risiko bootloop)"
                  return "keep", "library vendor"
              if rel.startswith("vendor/gpu/"):
                  return "keep", "gpu cache (kbc)"
              if rel.startswith("vendor/etc/"):
                  sub = rel[len("vendor/etc/"):]
                  top = sub.split("/")[0]
                  if top == "permissions":
                      return "keep", "permissions"
                  if top in ("init", "vintf", "selinux") or sub.startswith("sepolicy"):
                      return "skip", "init/vintf/selinux tidak boleh ikut"
                  if re.search(r"adreno|kgsl|vulkan|gpu|a7\d\d", sub, re.I):
                      return "keep", "konfigurasi GPU"
                  return "skip", "vendor/etc di luar daftar aman"
              if rel.startswith("etc/permissions/"):
                  return "keep", "permissions (system)"
              return "skip", "di luar path yang diizinkan"


          IGNORED_TOP = ("META-INF", "module.prop", "customize.sh", "service.sh", "post-fs-data.sh", "uninstall.sh",
                         "system.prop", "sepolicy.rule", "webroot", "README", "LICENSE", "changelog")


          def map_rel(root, f):
              parts = f.relative_to(root).parts
              if parts[0] == "system":
                  return "/".join(parts[1:])
              if parts[0] == "vendor":
                  return "/".join(parts)
              if parts[0].startswith(IGNORED_TOP) or len(parts) == 1:
                  return None
              return "/".join(["_luar"] + list(parts))  # product/odm/system_ext dst -> akan di-skip


          # ----------------------------------------------------------------------------
          # pack
          # ----------------------------------------------------------------------------
          def render(text, sub):
              for k, v in sub.items():
                  text = text.replace(f"@{k}@", v)
              return text


          def write_text(path, text, mode=0o644):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(text.replace("\r\n", "\n").encode("utf-8"))
              os.chmod(path, mode)


          def build_zip(zpath, entries):
              """entries: list of (arcname, bytes, mode). Deterministik."""
              if zpath.exists():
                  zpath.unlink()
              with zipfile.ZipFile(zpath, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for arc, data, mode in sorted(entries, key=lambda e: (not e[0].startswith("META-INF"), e[0])):
                      zi = zipfile.ZipInfo(arc, ZIP_DATE)
                      zi.compress_type = zipfile.ZIP_DEFLATED
                      zi.external_attr = (0o100000 | mode) << 16
                      zi.create_system = 3
                      zf.writestr(zi, data)


          def cmd_pack(a):
              out = Path(a.out)
              out.mkdir(parents=True, exist_ok=True)
              work = Path(a.work)
              tpl = Path(a.tpl)

              if not re.fullmatch(r"\d+(\.\d+){1,3}", a.version):
                  die(f"format versi tidak valid: {a.version} (contoh 837.0.9)")
              vparts = [int(x) for x in a.version.split(".")] + [0, 0, 0]
              rev = int(os.environ.get("GITHUB_RUN_NUMBER", "0") or 0) % 100
              vcode = (vparts[0] * 10000 + vparts[1] * 100 + vparts[2]) * 100 + rev

              blocklist = list(DEFAULT_BLOCKLIST)
              for pat in re.split(r"[\s,]+", a.extra_blocklist.strip()):
                  if pat:
                      blocklist.append(pat)
              extra_allow = [p for p in re.split(r"[\s,]+", a.extra_allow.strip()) if p]

              facts = {}
              if a.facts and Path(a.facts).is_file():
                  facts = json.loads(Path(a.facts).read_text())
              fw_ok = set()
              if a.include_firmware:
                  fw_ok = set(facts.get("firmware_required", [])) | {z + s for z in facts.get("zap_required", []) for s in ("", ".mbn", ".mdt")}
                  if not fw_ok:
                      warn("include_firmware aktif tapi daftar firmware kernel kosong (facts tidak ada)")

              base = materialize(a.src, work)
              expand_nested(base)
              root = find_root(base)
              print(f"root driver: {root.relative_to(base) or '.'}")

              # --- kumpulkan & putuskan --------------------------------------------------
              kept, skipped = {}, []
              for f in sorted(root.rglob("*")):
                  if f.is_symlink():
                      skipped.append((str(f.relative_to(root)), "symlink diabaikan"))
                      continue
                  if not f.is_file():
                      continue
                  rel = map_rel(root, f)
                  if rel is None:
                      continue
                  action, why = decide(rel, blocklist, extra_allow, fw_ok)
                  if action == "skip":
                      skipped.append((rel, why))
                  else:
                      kept[rel] = (f, why)
              if not kept:
                  die("Tidak ada file yang lolos filter.")

              # --- tulis ke staging & validasi --------------------------------------------
              modroot = work / "module"
              if modroot.exists():
                  shutil.rmtree(modroot)
              sysroot = modroot / "system"
              provided, all_needed, xml_notes, elf_count = set(), {}, [], 0
              ver_by_file = {}
              manifest_files = []
              for rel, (f, why) in sorted(kept.items()):
                  data = f.read_bytes()
                  if not data:
                      die(f"file kosong: {rel}")
                  isso = rel.endswith(".so")
                  info = elf_info(data)
                  if isso and info is None:
                      die(f"{rel}: bukan ELF valid (file rusak / pointer git-lfs / halaman HTML?)")
                  if info:
                      bits, machine, needed = info
                      in64 = re.match(r"vendor/lib64/", rel) is not None
                      in32 = re.match(r"vendor/lib/", rel) is not None
                      if in64 and (bits != 64 or machine != 183):
                          die(f"{rel}: harus ELF64 AArch64, ditemukan bits={bits} machine={machine}")
                      if in32 and (bits != 32 or machine != 40):
                          die(f"{rel}: harus ELF32 ARM, ditemukan bits={bits} machine={machine}")
                      elf_count += 1
                      provided.add(rel.rsplit("/", 1)[-1])
                      for n in needed:
                          all_needed.setdefault(n, []).append(rel)
                      if rel.endswith("/libGLESv2_adreno.so") or rel.endswith("/vulkan.adreno.so"):
                          found = {f"{int(mj)}.{int(mn)}" for mj, mn in re.findall(rb"V@0*(\d+)\.(\d+)", data)}
                          if found:
                              ver_by_file[rel] = sorted(found)
                  if rel.endswith(".xml"):
                      data, notes = sanitize_xml(data, rel)
                      if notes:
                          xml_notes.append((rel, notes))
                  dest = sysroot / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(data)
                  os.chmod(dest, 0o644)
                  manifest_files.append(rel)

              # --- cek kelengkapan -----------------------------------------------------------
              need_min = ["vendor/lib64/egl/libGLESv2_adreno.so"]
              for n in need_min:
                  if n not in kept:
                      die(f"file wajib tidak ada: {n}")
              for n in ("vendor/lib64/egl/libEGL_adreno.so", "vendor/lib64/hw/vulkan.adreno.so"):
                  if n not in kept:
                      warn(f"{n} tidak ada di source (driver bisa tidak lengkap)")
              if not any(r.startswith("vendor/lib/") for r in kept):
                  warn("tidak ada library 32-bit (vendor/lib): app 32-bit akan memakai driver stock -> mismatch")
              if not any(r.startswith("vendor/gpu/") for r in kept):
                  if any(p.is_dir() and p.name == "kbc" for p in base.rglob("kbc")):
                      warn("folder kbc ada di source tapi di luar vendor/gpu -> TIDAK dipasang (cek layout)")
                  else:
                      warn("source tidak punya vendor/gpu/kbc (Kernel Binary Cache) - lanjut tanpa")
              perm_files = [r for r in kept if "permissions/" in r]
              if not perm_files:
                  warn("source tidak punya XML permissions (Vulkan/feature) - pakai yang sudah ada di ROM")

              # dependensi yang dibutuhkan paket tapi ikut diblokir
              for n, users in sorted(all_needed.items()):
                  if any(fnmatch.fnmatch(n, pat) for pat in blocklist):
                      warn(f"{users[0]} membutuhkan {n} yang diblokir -> perlu versi stock ROM yang kompatibel")
              external = sorted(n for n in all_needed if n not in provided)

              # --- deteksi versi -------------------------------------------------------------
              want_mm = ".".join(a.version.split(".")[:2])
              want_major = a.version.split(".")[0]
              gl_versions = set()
              for vs in ver_by_file.values():
                  gl_versions.update(vs)
              if not ver_by_file:
                  warn("string versi 'V@xxxx.x' tidak ditemukan di libGLESv2_adreno.so/vulkan.adreno.so - versi tidak bisa diverifikasi")
              else:
                  bad = {r: v for r, v in ver_by_file.items() if want_mm not in v}
                  if bad:
                      same_major = all(any(x.split(".")[0] == want_major for x in v) for v in bad.values())
                      detail = "; ".join(f"{r}={v}" for r, v in sorted(bad.items()))
                      if same_major:
                          warn(f"minor versi berbeda dari {want_mm}: {detail}")
                      elif a.strict_version:
                          die(f"Versi di blob tidak cocok dengan {a.version} (campur / source salah?): {detail}")
                      else:
                          warn(f"versi di blob TIDAK cocok dengan {a.version}: {detail}")

              # --- firmware check vs kernel ------------------------------------------------------
              fw_present = {p.name for p in base.rglob("*") if p.is_file()}
              fw_missing = [n for n in facts.get("firmware_required", []) if n not in fw_present]
              if facts and not a.include_firmware:
                  print("firmware kernel (tidak dipasang, pakai stock ROM):", ", ".join(facts.get("firmware_required", [])))

              # --- file modul (template) --------------------------------------------------------
              title = f"Adreno 730 GPU Driver {a.version} (ingres)"
              sub = {"VERSION": "v" + a.version, "ID": MODULE_ID, "NAME": title}
              prop = "\n".join([
                  f"id={MODULE_ID}",
                  f"name={title}",
                  f"version=v{a.version}",
                  f"versionCode={vcode}",
                  "author=kingD2N",
                  f"description=Driver GPU Adreno 730 v{a.version} untuk POCO F4 GT (ingres), AOSP Android 16 QPR2. Bootloop guard aktif.",
                  "",
              ])
              write_text(modroot / "module.prop", prop)
              for name in ("customize.sh", "post-fs-data.sh", "service.sh", "uninstall.sh"):
                  write_text(modroot / name, render((tpl / name).read_text(), sub), 0o755)

              manifest = []
              for rel in sorted(manifest_files):
                  manifest.append(f"{sha256_file(sysroot / rel)}  system/{rel}")
              write_text(modroot / "ax_manifest.sha256", "\n".join(manifest) + "\n")

              # --- zip ------------------------------------------------------------------------------
              payload = []
              for p in sorted(modroot.rglob("*")):
                  if p.is_file():
                      rel = str(p.relative_to(modroot))
                      mode = 0o755 if rel.endswith(".sh") else 0o644
                      payload.append((rel, p.read_bytes(), mode))

              magisk_ub = render((tpl / "magisk_update_binary").read_text(), sub).encode()
              twrp_ub = render((tpl / "twrp_update_binary").read_text(), sub).encode()
              meta = "META-INF/com/google/android/"

              tag = f"Adreno730_v{a.version}_ingres_QPR2"
              z_mod = out / f"{tag}_Module.zip"
              z_rec = out / f"{tag}_TWRP.zip"
              build_zip(z_mod, payload + [
                  (meta + "update-binary", magisk_ub, 0o755),
                  (meta + "updater-script", b"#MAGISK\n", 0o644),
              ])
              build_zip(z_rec, [("module/" + r, d, m) for r, d, m in payload] + [
                  (meta + "update-binary", twrp_ub, 0o755),
                  (meta + "updater-script", b"# Installer recovery: logika ada di update-binary\n", 0o644),
              ])

              # --- laporan ------------------------------------------------------------------------------
              rep = {
                  "version": a.version,
                  "version_code": vcode,
                  "detected_gl_versions": sorted(gl_versions),
                  "files_kept": len(kept),
                  "elf_files": elf_count,
                  "skipped": [{"path": p, "reason": r} for p, r in skipped],
                  "xml_fixed": [{"path": p, "fixes": n} for p, n in xml_notes],
                  "external_deps": external,
                  "firmware_missing_in_source": fw_missing,
                  "warnings": WARNINGS,
                  "blocklist": blocklist,
                  "files": [{"path": f"system/{r}", "sha256": sha256_file(sysroot / r), "why": kept[r][1]} for r in sorted(kept)],
              }
              (out / "manifest.json").write_text(json.dumps(rep, indent=2, ensure_ascii=False) + "\n")

              sums = []
              for z in (z_mod, z_rec):
                  sums.append(f"{sha256_file(z)}  {z.name}")
              (out / "sha256sums.txt").write_text("\n".join(sums) + "\n")

              write_notes(out, a, rep, z_mod, z_rec, facts)
              print(f"OK: {len(kept)} file dipasang ({elf_count} ELF), {len(skipped)} dilewati, {len(WARNINGS)} peringatan")
              print("zip:", z_mod.name, z_rec.name)

              gh = os.environ.get("GITHUB_OUTPUT")
              if gh:
                  with open(gh, "a") as fh:
                      fh.write(f"module_zip={z_mod.name}\n")
                      fh.write(f"twrp_zip={z_rec.name}\n")
                      fh.write(f"tag={tag}\n")


          def write_notes(out, a, rep, z_mod, z_rec, facts):
              L = []
              L.append(f"# Adreno 730 GPU Driver v{a.version} - POCO F4 GT (ingres)")
              L.append("")
              L.append("Driver GPU userspace Adreno 730 untuk **AOSP / Android 16 QPR2** (AxionOS / LineageOS 23.2). "
                       "Dipasang systemless sebagai modul, tidak menulis ke partisi vendor.")
              L.append("")
              L.append("## File")
              L.append(f"- `{z_mod.name}`: flash lewat manager (KernelSU-Next / SukiSU / Magisk / MMRL)")
              L.append(f"- `{z_rec.name}`: flash lewat TWRP / OrangeFox (pasang ke `/data/adb/modules`, root harus sudah terpasang)")
              L.append("")
              L.append("## Cara pasang")
              L.append("1. **Manager:** Modul -> Install from storage -> pilih `_Module.zip` -> reboot.")
              L.append("2. **Recovery:** Boot TWRP/OrangeFox -> buka kunci /data -> Install `_TWRP.zip` -> reboot system.")
              L.append("3. Cek: `/data/local/tmp/ax_adreno730.log` (berisi string `GLES:` dari SurfaceFlinger setelah boot).")
              L.append("")
              L.append("## Keselamatan")
              L.append("- Guard di installer: hanya `ingres`, platform `taro/waipio`, Android 16+ (SDK 36).")
              L.append("- Bootloop guard: 3x boot berturut-turut gagal -> modul nonaktif sendiri (`disable` + `system.off`).")
              L.append("- Darurat dari recovery: hapus folder `/data/adb/modules/" + MODULE_ID + "`.")
              L.append("- Library berikut **tidak ikut** (bootloop di AxionOS QPR2, tetap pakai stock ROM): "
                       + ", ".join(f"`{b}`" for b in rep["blocklist"]) + ".")
              L.append("")
              L.append("## Isi paket")
              L.append(f"- {rep['files_kept']} file dipasang ({rep['elf_files']} ELF), {len(rep['skipped'])} file dilewati.")
              L.append("- Versi driver terdeteksi di blob: " + (", ".join(rep["detected_gl_versions"]) or "tidak terdeteksi"))
              if rep["xml_fixed"]:
                  L.append(f"- {len(rep['xml_fixed'])} file XML diperbaiki otomatis (encoding/BOM/NUL).")
              if rep["external_deps"]:
                  ext = rep["external_deps"]
                  L.append("- Dependensi dari luar paket (harus ada di ROM): " + ", ".join(f"`{d}`" for d in ext[:40])
                           + (f" (+{len(ext) - 40} lainnya, lihat manifest.json)" if len(ext) > 40 else ""))
              if rep["warnings"]:
                  L.append("")
                  L.append("## Peringatan build")
                  for w in rep["warnings"]:
                      L.append(f"- {w}")
              if facts:
                  L.append("")
                  L.append("## Kompatibilitas kernel (Tree_ingres)")
                  md = Path(a.out) / "kgsl-compat.md"
                  if md.is_file():
                      L.append(md.read_text().rstrip())
              L.append("")
              L.append("## SHA256")
              L.append("```")
              L.append((Path(a.out) / "sha256sums.txt").read_text().rstrip())
              L.append("```")
              L.append("")
              L.append("_Dibangun otomatis oleh GitHub Actions. by kingD2N._")
              (Path(a.out) / "RELEASE_NOTES.md").write_text("\n".join(L) + "\n")


          # ----------------------------------------------------------------------------
          # verify (dijalankan terhadap zip final, bukan staging)
          # ----------------------------------------------------------------------------
          def cmd_verify(a):
              out = Path(a.out)
              zips = sorted(out.glob("*.zip"))
              if len(zips) != 2:
                  die(f"harus ada 2 zip di {out}, ditemukan {len(zips)}")
              problems = []
              dash = shutil.which("dash")
              tmp = Path(a.work) / "verify"
              if tmp.exists():
                  shutil.rmtree(tmp)
              for z in zips:
                  is_twrp = z.name.endswith("_TWRP.zip")
                  pre = "module/" if is_twrp else ""
                  with zipfile.ZipFile(z) as zf:
                      bad = zf.testzip()
                      if bad:
                          problems.append(f"{z.name}: entri rusak {bad}")
                      names = zf.namelist()
                      for req in ("META-INF/com/google/android/update-binary", "META-INF/com/google/android/updater-script",
                                  pre + "module.prop", pre + "customize.sh", pre + "post-fs-data.sh", pre + "service.sh",
                                  pre + "uninstall.sh", pre + "ax_manifest.sha256"):
                          if req not in names:
                              problems.append(f"{z.name}: {req} tidak ada")
                      prop = zf.read(pre + "module.prop").decode()
                      for key in ("id=", "name=", "version=", "versionCode=", "author=kingD2N", "description="):
                          if key not in prop:
                              problems.append(f"{z.name}: module.prop tanpa {key}")
                      if "updateJson" in prop:
                          problems.append(f"{z.name}: module.prop tidak boleh updateJson")
                      # skrip
                      d = tmp / z.stem
                      zf.extractall(d)
                      for n in names:
                          if n.endswith(".sh") or n.endswith("update-binary"):
                              raw = zf.read(n)
                              if b"\r" in raw or b"\x00" in raw:
                                  problems.append(f"{z.name}:{n} mengandung CR/NUL")
                              if re.search(r"@(VERSION|ID|NAME)@", raw.decode()):
                                  problems.append(f"{z.name}:{n} placeholder belum diganti")
                              for sh in ("sh", "dash") if dash else ("sh",):
                                  r = subprocess.run([sh, "-n", str(d / n)], capture_output=True, text=True)
                                  if r.returncode != 0:
                                      problems.append(f"{z.name}:{n} {sh} -n: {r.stderr.strip()}")
                      # manifest
                      mf = zf.read(pre + "ax_manifest.sha256").decode().splitlines()
                      listed = set()
                      for line in mf:
                          h, p = line.split("  ", 1)
                          listed.add(p)
                          if sha256_bytes(zf.read(pre + p)) != h:
                              problems.append(f"{z.name}: hash tidak cocok {p}")
                      actual = {n[len(pre):] for n in names if n[len(pre):].startswith("system/")}
                      if listed != actual:
                          problems.append(f"{z.name}: manifest != isi system/ ({len(listed)} vs {len(actual)})")
                      # ELF + XML + blocklist
                      for n in names:
                          short = n[len(pre):]
                          base = short.rsplit("/", 1)[-1]
                          if short.startswith("system/") and any(fnmatch.fnmatch(base, p) for p in DEFAULT_BLOCKLIST):
                              problems.append(f"{z.name}: file blocklist ikut terpasang: {short}")
                          if short.endswith(".so"):
                              info = elf_info(zf.read(n))
                              if not info:
                                  problems.append(f"{z.name}: {short} bukan ELF")
                              else:
                                  if "/lib64/" in short and (info[0], info[1]) != (64, 183):
                                      problems.append(f"{z.name}: {short} bukan aarch64")
                                  if "/lib/" in short and (info[0], info[1]) != (32, 40):
                                      problems.append(f"{z.name}: {short} bukan arm32")
                          if short.endswith(".xml"):
                              raw = zf.read(n)
                              if b"\x00" in raw or raw[:3] == b"\xef\xbb\xbf" or raw[:2] in (b"\xff\xfe", b"\xfe\xff"):
                                  problems.append(f"{z.name}: XML encoding salah {short}")
                              try:
                                  ET.fromstring(raw)
                              except ET.ParseError as ex:
                                  problems.append(f"{z.name}: XML tidak valid {short}: {ex}")
              if problems:
                  for p in problems:
                      print(f"::error::{p}")
                  sys.exit(1)
              print(f"verify OK: {len(zips)} zip lolos semua cek")


          def main():
              ap = argparse.ArgumentParser()
              sp = ap.add_subparsers(dest="cmd", required=True)
              p = sp.add_parser("pack")
              p.add_argument("--src", required=True)
              p.add_argument("--version", required=True)
              p.add_argument("--tpl", required=True)
              p.add_argument("--out", required=True)
              p.add_argument("--work", default="work")
              p.add_argument("--facts", default="")
              p.add_argument("--extra-blocklist", default="")
              p.add_argument("--extra-allow", default="")
              p.add_argument("--include-firmware", action="store_true")
              p.add_argument("--strict-version", action="store_true")
              v = sp.add_parser("verify")
              v.add_argument("--out", required=True)
              v.add_argument("--work", default="work")
              a = ap.parse_args()
              {"pack": cmd_pack, "verify": cmd_verify}[a.cmd](a)


          if __name__ == "__main__":
              main()
          __AX_EOF_ADRENO_PACK__

          cat > ax/tpl/customize.sh <<'__AX_EOF_TPL_CUSTOMIZE__'
          #!/system/bin/sh
          # Adreno 730 GPU Driver @VERSION@ (ingres) - by kingD2N
          # Di-source oleh installer Magisk / KernelSU / SukiSU. File sudah diekstrak ke $MODPATH.

          ui_print "*******************************************"
          ui_print "  Adreno 730 GPU Driver @VERSION@"
          ui_print "  POCO F4 GT (ingres) - AOSP Android 16 QPR2"
          ui_print "  by kingD2N"
          ui_print "*******************************************"

          # --- guard device ------------------------------------------------------------
          DEV="$(getprop ro.product.device)"
          BP="$(getprop ro.build.product)"
          VDEV="$(getprop ro.product.vendor.device)"
          ok=0
          for v in "$DEV" "$BP" "$VDEV"; do
            [ "$v" = "ingres" ] && ok=1
          done
          [ "$ok" = "1" ] || abort "Device bukan ingres (device=$DEV product=$BP). Modul dibatalkan."

          PLAT="$(getprop ro.board.platform)"
          case "$PLAT" in
            taro|waipio) ;;
            *) abort "Platform '$PLAT' bukan SM8450 (taro/waipio). Modul dibatalkan." ;;
          esac

          SDK="$(getprop ro.build.version.sdk)"
          case "$SDK" in ''|*[!0-9]*) SDK=0 ;; esac
          [ "$SDK" -ge 36 ] || abort "Butuh Android 16 / QPR2 (SDK 36+), terdeteksi SDK $SDK."

          GM=/sys/class/kgsl/kgsl-3d0/gpu_model
          if [ -r "$GM" ]; then
            case "$(cat "$GM" 2>/dev/null)" in
              *730*) ui_print "- GPU terdeteksi: $(cat "$GM")" ;;
              *) abort "GPU bukan Adreno 730 ($(cat "$GM"))." ;;
            esac
          fi

          # --- verifikasi integritas -----------------------------------------------------
          ui_print "- Verifikasi integritas file..."
          bad=0
          total=0
          while read -r h f; do
            [ -n "$f" ] || continue
            total=$((total + 1))
            a="$(sha256sum "$MODPATH/$f" 2>/dev/null | cut -d' ' -f1)"
            if [ "$a" != "$h" ]; then
              bad=$((bad + 1))
              ui_print "  rusak: $f"
            fi
          done < "$MODPATH/ax_manifest.sha256"
          [ "$bad" = "0" ] || abort "$bad dari $total file rusak. Unduh ulang zip."
          ui_print "- $total file OK"

          # --- permission ----------------------------------------------------------------
          set_perm_recursive "$MODPATH" 0 0 0755 0644
          for s in post-fs-data.sh service.sh uninstall.sh; do
            [ -f "$MODPATH/$s" ] && set_perm "$MODPATH/$s" 0 0 0755
          done
          rm -f "$MODPATH/.boot_count" "$MODPATH/disable"

          ui_print "- Selesai. Reboot untuk mengaktifkan driver."
          ui_print "- Bootloop guard: 3x gagal boot berturut-turut -> modul nonaktif otomatis."
          ui_print "- Log: /data/local/tmp/ax_adreno730.log"
          __AX_EOF_TPL_CUSTOMIZE__

          cat > ax/tpl/post-fs-data.sh <<'__AX_EOF_TPL_POSTFS__'
          #!/system/bin/sh
          # Adreno 730 GPU Driver @VERSION@ (ingres) - by kingD2N
          # 1) bootloop guard  2) samakan SELinux context file modul dengan file stock di /vendor
          MODDIR=${0%/*}
          LOG=${AX_LOG:-/data/local/tmp/ax_adreno730.log}
          CNT="$MODDIR/.boot_count"
          MAXFAIL=3

          log() { echo "$(date '+%m-%d %H:%M:%S') [post-fs-data] $*" >> "$LOG" 2>/dev/null; }

          # batasi log 400 baris
          if [ -f "$LOG" ] && [ "$(wc -l < "$LOG" 2>/dev/null)" -gt 400 ]; then
            tail -n 300 "$LOG" > "$LOG.tmp" 2>/dev/null && mv "$LOG.tmp" "$LOG"
          fi

          # --- bootloop guard ------------------------------------------------------------
          n=0
          [ -f "$CNT" ] && n="$(cat "$CNT" 2>/dev/null)"
          case "$n" in ''|*[!0-9]*) n=0 ;; esac
          n=$((n + 1))
          echo "$n" > "$CNT"

          if [ "$n" -gt "$MAXFAIL" ]; then
            log "bootloop guard: $((n - 1)) boot berturut-turut tidak selesai -> modul dinonaktifkan"
            touch "$MODDIR/disable"
            [ -d "$MODDIR/system" ] && mv "$MODDIR/system" "$MODDIR/system.off"
            rm -f "$CNT"
            exit 0
          fi

          # --- SELinux context -----------------------------------------------------------
          # Library GL/Vulkan vendor harus berlabel same_process_hal_file (bukan vendor_file),
          # kalau tidak aplikasi gagal memuat driver. Ambil label dari file stock yang ditimpa.
          ctx_ref() {
            rel="${1#"$MODDIR"/system}"
            case "$rel" in
              /vendor|/vendor/*) ref="$rel" ;;
              *) ref="/system$rel" ;;
            esac
            c=""
            if [ -e "$ref" ]; then
              c="$(stat -c %C "$ref" 2>/dev/null)"
              case "$c" in u:object_r:*:*) ;; *) c="$(ls -dZ "$ref" 2>/dev/null | cut -d' ' -f1)" ;; esac
            fi
            case "$c" in u:object_r:*:*) echo "$c"; return ;; esac
            case "$rel" in
              /vendor/lib*/egl|/vendor/lib*/egl/*|/vendor/lib*/hw/vulkan.*|/vendor/lib*/libadreno_utils.so|/vendor/lib*/libgsl.so|/vendor/lib*/libCB.so|/vendor/lib*/libllvm-*.so|/vendor/lib*/libq3dtools_adreno.so|/vendor/lib*/libVkLayer_*|/vendor/lib*/libOpenCL*|/vendor/lib*/libGLES*|/vendor/lib*/libEGL*|/vendor/lib*/eglSubDriver*)
                echo u:object_r:same_process_hal_file:s0 ;;
              /vendor/etc|/vendor/etc/*) echo u:object_r:vendor_configs_file:s0 ;;
              /vendor|/vendor/*) echo u:object_r:vendor_file:s0 ;;
              *) echo u:object_r:system_file:s0 ;;
            esac
          }

          if [ -d "$MODDIR/system" ]; then
            find "$MODDIR/system" 2>/dev/null | while IFS= read -r p; do
              chcon "$(ctx_ref "$p")" "$p" 2>/dev/null
            done
          fi

          log "boot #$n: konteks SELinux diset, modul aktif"
          exit 0
          __AX_EOF_TPL_POSTFS__

          cat > ax/tpl/service.sh <<'__AX_EOF_TPL_SERVICE__'
          #!/system/bin/sh
          # Adreno 730 GPU Driver @VERSION@ (ingres) - by kingD2N
          MODDIR=${0%/*}
          LOG=${AX_LOG:-/data/local/tmp/ax_adreno730.log}

          log() { echo "$(date '+%m-%d %H:%M:%S') [service] $*" >> "$LOG" 2>/dev/null; }

          until [ "$(getprop sys.boot_completed)" = "1" ]; do sleep 5; done
          sleep 30

          # boot sampai stabil -> reset counter bootloop
          rm -f "$MODDIR/.boot_count"
          log "boot stabil, counter bootloop di-reset"
          log "gpu_model=$(cat /sys/class/kgsl/kgsl-3d0/gpu_model 2>/dev/null) egl=$(getprop ro.hardware.egl) vulkan=$(getprop ro.hardware.vulkan)"
          gl="$(dumpsys SurfaceFlinger 2>/dev/null | grep -m1 'GLES:')"
          [ -n "$gl" ] && log "$gl"
          exit 0
          __AX_EOF_TPL_SERVICE__

          cat > ax/tpl/uninstall.sh <<'__AX_EOF_TPL_UNINSTALL__'
          #!/system/bin/sh
          # Modul systemless: tidak ada perubahan di partisi. Cukup bersihkan log.
          rm -f /data/local/tmp/ax_adreno730.log /data/local/tmp/ax_adreno730.log.tmp
          exit 0
          __AX_EOF_TPL_UNINSTALL__

          cat > ax/tpl/magisk_update_binary <<'__AX_EOF_TPL_MAGISK_UB__'
          #!/sbin/sh
          #################
          # Initialization
          #################
          umask 022
          ui_print() { echo "$1"; }
          require_new_magisk() {
            ui_print "*******************************"
            ui_print " Install Magisk v20.4+ atau KernelSU/SukiSU terbaru! "
            ui_print "*******************************"
            exit 1
          }
          #########################
          # Load util_functions.sh
          #########################
          OUTFD=$2
          ZIPFILE=$3
          mount /data 2>/dev/null
          [ -f /data/adb/magisk/util_functions.sh ] || require_new_magisk
          . /data/adb/magisk/util_functions.sh
          [ "$MAGISK_VER_CODE" -lt 20400 ] && require_new_magisk
          install_module
          exit 0
          __AX_EOF_TPL_MAGISK_UB__

          cat > ax/tpl/twrp_update_binary <<'__AX_EOF_TPL_TWRP_UB__'
          #!/sbin/sh
          # Installer recovery (TWRP / OrangeFox) - Adreno 730 GPU Driver @VERSION@ (ingres) - by kingD2N
          # Memasang modul systemless ke /data/adb/modules (dibaca KernelSU / SukiSU / Magisk saat boot).
          # Tidak menulis ke partisi system/vendor sama sekali.
          OUTFD="$2"
          ZIPFILE="$3"
          ID="@ID@"
          DATA="${AX_DATA:-/data}"
          TMP="${AX_TMP:-/tmp/ax_adreno730}"

          ui_print() {
            if [ -n "$OUTFD" ] && [ -e "/proc/self/fd/$OUTFD" ]; then
              printf 'ui_print %s\nui_print\n' "$1" >> "/proc/self/fd/$OUTFD"
            else
              echo "$1"
            fi
          }
          fail() {
            ui_print "! $1"
            ui_print "! Instalasi dibatalkan, device tidak diubah."
            rm -rf "$TMP"
            exit 1
          }

          ui_print " "
          ui_print "*******************************************"
          ui_print "  Adreno 730 GPU Driver @VERSION@"
          ui_print "  POCO F4 GT (ingres) - AOSP Android 16 QPR2"
          ui_print "  Installer recovery - by kingD2N"
          ui_print "*******************************************"

          # --- guard device --------------------------------------------------------------
          d1="$(getprop ro.product.device)"
          d2="$(getprop ro.build.product)"
          d3="$(getprop ro.product.vendor.device)"
          d4="$(getprop ro.product.system.device)"
          ok=0
          for v in "$d1" "$d2" "$d3" "$d4"; do
            case "$v" in ingres|ingres_*) ok=1 ;; esac
          done
          [ "$ok" = "1" ] || fail "Device bukan ingres (device='$d1' product='$d2')"

          # --- mount /data -----------------------------------------------------------------
          if [ -z "$AX_DATA" ]; then
            mountpoint -q /data 2>/dev/null || mount /data 2>/dev/null
          fi
          if [ ! -d "$DATA/adb" ]; then
            [ -d "$DATA/system" ] || fail "/data tidak ter-mount atau masih terenkripsi (buka kunci di recovery dulu)"
            ui_print "! /data/adb belum ada: root (KernelSU/Magisk) belum terpasang."
            ui_print "! Modul baru aktif setelah root terpasang."
            mkdir -p "$DATA/adb/modules"
          fi

          # --- ekstrak + verifikasi payload ----------------------------------------------------
          rm -rf "$TMP"
          mkdir -p "$TMP" || fail "folder tmp tidak bisa dibuat"
          unzip -o "$ZIPFILE" -d "$TMP" >/dev/null 2>&1 || fail "gagal ekstrak zip (file rusak?)"
          SRC="$TMP/module"
          [ -f "$SRC/module.prop" ] || fail "payload modul tidak lengkap"
          [ -f "$SRC/ax_manifest.sha256" ] || fail "manifest integritas tidak ada"

          ui_print "- Verifikasi integritas file..."
          bad=0
          total=0
          while read -r h f; do
            [ -n "$f" ] || continue
            total=$((total + 1))
            a="$(sha256sum "$SRC/$f" 2>/dev/null | cut -d' ' -f1)"
            if [ "$a" != "$h" ]; then
              bad=$((bad + 1))
              ui_print "  rusak: $f"
            fi
          done < "$SRC/ax_manifest.sha256"
          [ "$bad" = "0" ] || fail "$bad dari $total file rusak, unduh ulang zip"
          ui_print "- $total file OK"

          # --- pasang -----------------------------------------------------------------------
          MODS="$DATA/adb/modules"
          mkdir -p "$MODS" || fail "tidak bisa membuat $MODS"
          rm -rf "$MODS/.$ID.new" "$DATA/adb/modules_update/$ID"
          cp -a "$SRC" "$MODS/.$ID.new" || fail "gagal menyalin modul ke $MODS"
          rm -rf "${MODS:?}/${ID:?}"
          mv "$MODS/.$ID.new" "$MODS/$ID" || fail "gagal memindahkan modul"

          find "$MODS/$ID" -type d -exec chmod 0755 {} \; 2>/dev/null
          find "$MODS/$ID" -type f -exec chmod 0644 {} \; 2>/dev/null
          for s in post-fs-data.sh service.sh uninstall.sh; do
            [ -f "$MODS/$ID/$s" ] && chmod 0755 "$MODS/$ID/$s"
          done
          chown -R 0:0 "$MODS/$ID" 2>/dev/null
          rm -f "$MODS/$ID/.boot_count" "$MODS/$ID/disable" "$MODS/$ID/remove"
          sync

          rm -rf "$TMP"
          ui_print "- Terpasang: $MODS/$ID"
          ui_print "- Reboot system untuk mengaktifkan driver."
          ui_print "- Bootloop guard: 3x gagal boot berturut-turut -> modul nonaktif otomatis."
          ui_print "- Darurat: hapus folder $MODS/$ID dari recovery."
          exit 0
          __AX_EOF_TPL_TWRP_UB__

      - name: Fakta KGSL / Adreno 730 dari Tree_ingres
        env:
          TREE_BRANCH: ${{ inputs.tree_branch }}
        run: |
          set -euo pipefail
          mkdir -p out
          TREE_SHA="$(git -C tree rev-parse HEAD)" python3 ax/scripts/kgsl_facts.py tree out

      - name: Ambil source driver
        env:
          SRC_URL: ${{ inputs.src_url }}
          SRC_PATH: ${{ inputs.src_path }}
          SRC_SHA256: ${{ inputs.src_sha256 }}
        run: bash ax/scripts/fetch_source.sh

      - name: Rakit modul + zip TWRP
        env:
          DRIVER_VERSION: ${{ inputs.driver_version }}
          INCLUDE_FW: ${{ inputs.include_firmware }}
          EXTRA_BLOCKLIST: ${{ inputs.extra_blocklist }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq p7zip-full >/dev/null 2>&1 || true
          args=(pack --src dl --version "$DRIVER_VERSION" --tpl ax/tpl --out out --work work
                --facts out/kgsl-compat.json --extra-blocklist "$EXTRA_BLOCKLIST" --strict-version)
          if [ "$INCLUDE_FW" = "true" ]; then args+=(--include-firmware); fi
          python3 ax/scripts/adreno_pack.py "${args[@]}"

      - name: Self-test zip (syntax shell, ELF, XML, hash, blocklist)
        run: |
          set -euo pipefail
          python3 ax/scripts/adreno_pack.py verify --out out --work work
          echo "### Isi zip"
          for z in out/*.zip; do echo "--- $z"; unzip -l "$z" | sed -n '4,44p'; done

      - name: Ringkasan
        run: |
          set -euo pipefail
          {
            cat out/RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adreno730-ingres-${{ inputs.driver_version }}
          path: |
            out/*.zip
            out/sha256sums.txt
            out/manifest.json
            out/kgsl-compat.json
            out/RELEASE_NOTES.md
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRIVER_VERSION: ${{ inputs.driver_version }}
          PRERELEASE: ${{ inputs.prerelease }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          TAG="adreno730-v${DRIVER_VERSION}-r${RUN_NUMBER}"
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" \
            out/*.zip out/sha256sums.txt out/manifest.json out/kgsl-compat.json \
            --target "$GITHUB_SHA" \
            --title "Adreno 730 GPU Driver v${DRIVER_VERSION} - ingres (QPR2) r${RUN_NUMBER}" \
            --notes-file out/RELEASE_NOTES.md \
            "${flags[@]}"
          echo "Release: $TAG"
