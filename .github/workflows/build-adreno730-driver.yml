# =============================================================================
name: Build Adreno 730 GPU Driver (ingres)

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: 'custom = zip 837.0.9 default / src_url | latest = stock publik tertinggi | stock = blob Xiaomi SM8450'
        type: choice
        options:
          - custom
          - latest
          - stock
        default: custom
      driver_version:
        description: 'Versi WAJIB cocok untuk zip custom (kosong = versi asli dari zip). latest/stock mengabaikan ini'
        required: false
        default: '837.0.9'
      src_url:
        description: 'Kosong = zip default (release GPU). Isi untuk zip lain (direct / GitHub release / GDrive / Mega)'
        required: false
        default: ''
      src_sha256:
        description: 'SHA256 file source (opsional, verifikasi unduhan)'
        required: false
        default: ''
      src_path:
        description: 'Alternatif: path file/folder source di repo ini'
        required: false
        default: ''
      tree_branch:
        description: 'Branch Tree_ingres'
        required: false
        default: 'Ingres_tree'
      include_firmware:
        description: 'Ikutkan a730_sqe.fw dari source (eksperimental, mungkin tanpa efek; default pakai stock ROM)'
        type: boolean
        default: false
      extra_blocklist:
        description: 'Tambahan file yang TIDAK dipasang (nama/glob, pisah spasi/koma)'
        required: false
        default: ''
      publish_release:
        description: 'Buat GitHub Release'
        type: boolean
        default: true
      prerelease:
        description: 'Tandai sebagai pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  TREE_REPO: kingD2N/Tree_ingres
  DEFAULT_SRC_URL: https://github.com/kingD2N/QGL_VK_TES/releases/download/GPU/Axion_GPU_Driver_V837_0_9_ingres_QPR2_TWRP.zip

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build driver Adreno 730
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repo ini
        uses: actions/checkout@v4

      - name: Checkout Tree_ingres (hanya file KGSL / GPU)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TREE_REPO }}
          ref: ${{ inputs.tree_branch }}
          token: ${{ secrets.TREE_TOKEN || github.token }}
          path: tree
          fetch-depth: 1
          sparse-checkout: |
            /Makefile
            /include/uapi/linux/msm_kgsl.h
            /drivers/gpu/msm/adreno-gpulist.h
            /arch/arm64/configs/vendor/*.config
          sparse-checkout-cone-mode: false

      - name: Validasi input
        id: input
        env:
          DRIVER_VERSION: ${{ inputs.driver_version }}
          SRC_MODE: ${{ inputs.source_mode }}
          SRC_URL: ${{ inputs.src_url }}
          SRC_PATH: ${{ inputs.src_path }}
        run: |
          set -euo pipefail
          if [ -n "$DRIVER_VERSION" ] && ! printf '%s' "$DRIVER_VERSION" | grep -qE '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::driver_version tidak valid: '$DRIVER_VERSION' (contoh 837.0.9, atau kosongkan)"
            exit 1
          fi
          # versi wajib hanya untuk zip sendiri; mode latest/stock memakai versi asli blob
          req="$DRIVER_VERSION"
          if [ "$SRC_MODE" != "custom" ] && [ -z "$SRC_URL" ] && [ -z "$SRC_PATH" ]; then req=""; fi
          echo "version=$req" >> "$GITHUB_OUTPUT"
          echo "Mode: $SRC_MODE | versi wajib: ${req:-(otomatis dari source)}"

      - name: Tulis skrip packager
        run: |
          set -euo pipefail
          mkdir -p ax/scripts ax/tpl
          cat > ax/scripts/kgsl_facts.py <<'__AX_EOF_KGSL_FACTS__'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """Ambil fakta KGSL / Adreno 730 dari Tree_ingres (kernel source ingres).

          Dipakai untuk: (1) laporan kompatibilitas di release notes, (2) daftar firmware
          yang diminta kernel (a730_sqe.fw, gmu_gen70000.bin, a730_zap) supaya packager
          bisa mengecek isi source driver.

          Pemakaian: kgsl_facts.py <tree_dir> <out_dir>
          """
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          if len(sys.argv) != 3:
              sys.exit("usage: kgsl_facts.py <tree_dir> <out_dir>")

          tree = Path(sys.argv[1])
          out = Path(sys.argv[2])
          out.mkdir(parents=True, exist_ok=True)

          A730_CHIPIDS = {"0x07030000": "primary (SM8450 / ingres)", "0x07030001": "varian v2"}


          def die(msg):
              print(f"::error::{msg}")
              sys.exit(1)


          def read(rel):
              p = tree / rel
              if not p.is_file():
                  die(f"{rel} tidak ada di Tree_ingres (branch salah atau sparse-checkout gagal)")
              return p.read_text(errors="replace")


          # --- versi kernel --------------------------------------------------------
          mk = read("Makefile")
          parts = []
          for key in ("VERSION", "PATCHLEVEL", "SUBLEVEL"):
              m = re.search(rf"^{key}\s*=\s*(\d+)", mk, re.M)
              parts.append(m.group(1) if m else "?")
          kernel_version = ".".join(parts)

          # --- versi UAPI KGSL -------------------------------------------------------
          uapi = read("include/uapi/linux/msm_kgsl.h")
          vmaj = re.search(r"#define\s+KGSL_VERSION_MAJOR\s+(\d+)", uapi)
          vmin = re.search(r"#define\s+KGSL_VERSION_MINOR\s+(\d+)", uapi)
          if not (vmaj and vmin):
              die("KGSL_VERSION_MAJOR/MINOR tidak ditemukan di msm_kgsl.h")
          kgsl_uapi = f"{vmaj.group(1)}.{vmin.group(1)}"

          # --- entri Adreno 730 di adreno-gpulist.h ----------------------------------
          gl = read("drivers/gpu/msm/adreno-gpulist.h")
          cores = []
          for m in re.finditer(r"static const struct adreno_gen7_core (\w+) = \{(.*?)\n\};", gl, re.S):
              name, body = m.group(1), m.group(2)
              cid = re.search(r"\.chipid\s*=\s*(0x[0-9a-fA-F]+)", body)
              if not cid:
                  continue
              chipid = "0x%08x" % int(cid.group(1), 16)
              if chipid not in A730_CHIPIDS:
                  continue

              def field(pat, body=body):
                  f = re.search(pat, body)
                  return f.group(1) if f else None

              gmuv = re.search(r"GMU_VERSION\((\d+),\s*(\d+),\s*(\d+)\)", body)
              cores.append({
                  "name": name.replace("adreno_gpu_core_", ""),
                  "chipid": chipid,
                  "note": A730_CHIPIDS[chipid],
                  "compatible": field(r'\.compatible\s*=\s*"([^"]+)"'),
                  "sqe_fw": field(r'\.sqefw_name\s*=\s*"([^"]+)"'),
                  "gmu_fw": field(r'\.gmufw_name\s*=\s*"([^"]+)"'),
                  "gmu_fw_bak": field(r'\.gmufw_bak_name\s*=\s*"([^"]+)"'),
                  "zap": field(r'\.zap_name\s*=\s*"([^"]+)"'),
                  "gmu_fw_version": ".".join(gmuv.groups()) if gmuv else None,
              })
          if not cores:
              die("Adreno 730 (chipid 0x07030000/0x07030001) tidak ada di adreno-gpulist.h")

          # --- status CONFIG_QCOM_KGSL di config waipio/ingres ------------------------
          configs = {}
          cfgdir = tree / "arch/arm64/configs/vendor"
          if cfgdir.is_dir():
              for f in sorted(cfgdir.glob("*.config")):
                  if not re.search(r"waipio|ingres", f.name):
                      continue
                  hits = []
                  for line in f.read_text(errors="replace").splitlines():
                      if re.match(r"^(# )?CONFIG_(QCOM_KGSL|DEVFREQ_GOV_QCOM_ADRENO_TZ|QCOM_ADRENO_DEFAULT_GOVERNOR)", line):
                          hits.append(line.strip())
                  if hits:
                      configs[f.name] = hits

          # --- commit tree -----------------------------------------------------------
          sha = os.environ.get("TREE_SHA", "")
          if not sha:
              try:
                  sha = subprocess.run(["git", "-C", str(tree), "rev-parse", "HEAD"],
                                       capture_output=True, text=True, check=True).stdout.strip()
              except Exception:
                  sha = "unknown"

          primary = next((c for c in cores if c["chipid"] == "0x07030000"), cores[0])
          fw_names = sorted({v for c in cores for v in (c["sqe_fw"], c["gmu_fw"], c["gmu_fw_bak"]) if v})
          zap_names = sorted({c["zap"] for c in cores if c["zap"]})

          facts = {
              "tree": {
                  "repo": os.environ.get("TREE_REPO", ""),
                  "branch": os.environ.get("TREE_BRANCH", ""),
                  "commit": sha,
              },
              "kernel_version": kernel_version,
              "kgsl_uapi": kgsl_uapi,
              "primary_core": primary["name"],
              "cores": cores,
              "firmware_required": fw_names,
              "zap_required": zap_names,
              "kgsl_configs": configs,
          }
          (out / "kgsl-compat.json").write_text(json.dumps(facts, indent=2, ensure_ascii=False) + "\n")

          md = [
              "| Item | Nilai |",
              "|---|---|",
              f"| Tree | `{facts['tree']['repo']}` @ `{facts['tree']['branch']}` (`{sha[:9]}`) |",
              f"| Kernel | Linux {kernel_version} (msm-kernel, GKI) |",
              f"| KGSL UAPI | {kgsl_uapi} |",
          ]
          for c in cores:
              md.append(f"| Core `{c['name']}` | chipid `{c['chipid']}` ({c['note']}), dt `{c['compatible']}`, GMU fw v{c['gmu_fw_version']} |")
          md.append(f"| Firmware diminta kernel | `{'`, `'.join(fw_names + zap_names)}` |")
          (out / "kgsl-compat.md").write_text("\n".join(md) + "\n")

          print(f"KGSL UAPI {kgsl_uapi} | kernel {kernel_version} | core utama {primary['name']} ({primary['chipid']})")
          print("firmware diminta kernel:", ", ".join(fw_names + zap_names))

          gh = os.environ.get("GITHUB_OUTPUT")
          if gh:
              with open(gh, "a") as fh:
                  fh.write(f"kgsl_uapi={kgsl_uapi}\n")
                  fh.write(f"kernel_version={kernel_version}\n")
          __AX_EOF_KGSL_FACTS__

          cat > ax/scripts/fetch_source.sh <<'__AX_EOF_FETCH_SOURCE__'
          #!/usr/bin/env bash
          # Ambil source driver Adreno ke folder dl/ dan tulis deskripsi sumber ke out/source.txt
          #
          # Urutan:  SRC_PATH (file di repo)  >  SRC_URL  >  mode:
          #   SRC_MODE=custom (default)  zip default DEFAULT_SRC_URL (mis. release GPU di repo ini) atau src_url / src_path
          #   SRC_MODE=latest            driver stock Adreno 730 versi TERTINGGI dari repo blob publik (find_latest.py)
          #   SRC_MODE=stock             blob stock Xiaomi SM8450 (sama seperti ROM ingres), versi dipatok
          #
          # Env: SRC_MODE, SRC_URL, SRC_PATH, SRC_SHA256, DEFAULT_SRC_URL, GH_TOKEN
          #      GLOBAL_REPO / GLOBAL_BRANCH / GLOBAL_URL (mode stock), LATEST_CANDIDATES / PREFER_BRANCH / GLOBAL_BASE_URL (mode latest)
          set -euo pipefail

          rm -rf dl && mkdir -p dl out
          : > out/source.txt
          note() { printf '%s\n' "$*" >> out/source.txt; }

          # fetch_blobs <repo> <url> <branch> <prefix>  -> dl/vendor/... (branch tidak ada -> lineage-* terbaru)
          fetch_blobs() {
            local repo="$1" url="$2" want="$3" P="$4" br tmp
            echo "Ambil blob GPU dari $repo"

            if ! git ls-remote --heads "$url" >/dev/null 2>&1; then
              echo "::error::Repo sumber publik tidak bisa diakses: $url"
              echo "::error::Coba lagi nanti, atau pakai source_mode=custom."
              exit 1
            fi
            if git ls-remote --exit-code --heads "$url" "$want" >/dev/null 2>&1; then
              br="$want"
            else
              br="$(git ls-remote --heads "$url" 'lineage-*' | sed 's#.*refs/heads/##' | sort -V | tail -n 1)"
              [ -n "$br" ] || { echo "::error::Tidak ada branch lineage-* di $url"; exit 1; }
              echo "::warning::Branch $want tidak ada, pakai $br"
            fi

            tmp="$(mktemp -d)"
            git clone -q --depth 1 --filter=blob:none --sparse -b "$br" "$url" "$tmp/g"
            git -C "$tmp/g" sparse-checkout set --no-cone \
              "/${P}vendor/lib/egl/" \
              "/${P}vendor/lib64/egl/" \
              "/${P}vendor/lib/hw/vulkan.adreno.so" \
              "/${P}vendor/lib64/hw/vulkan.adreno.so" \
              "/${P}vendor/lib*/libgsl.so" \
              "/${P}vendor/lib*/libadreno_utils.so" \
              "/${P}vendor/lib*/libadreno_app_profiles.so" \
              "/${P}vendor/lib*/libllvm-*.so" \
              "/${P}vendor/lib*/libCB.so" \
              "/${P}vendor/gpu/" \
              "/${P}vendor/firmware/a730_sqe.fw" \
              "/${P}vendor/firmware/gmu_gen70000.bin"

            if [ ! -f "$tmp/g/${P}vendor/lib64/egl/libGLESv2_adreno.so" ]; then
              echo "::error::libGLESv2_adreno.so tidak ada di $repo@$br (struktur repo berubah?)"
              exit 1
            fi
            mkdir -p dl/vendor
            cp -a "$tmp/g/${P}vendor/." dl/vendor/
            BLOB_BRANCH="$br"
            BLOB_SHA="$(git -C "$tmp/g" rev-parse --short=10 HEAD)"
            BLOB_DATE="$(git -C "$tmp/g" log -1 --format=%cs)"
            rm -rf "$tmp"
            echo "Sumber: $repo@$br ($BLOB_SHA, $BLOB_DATE)"
          }

          fetch_stock() {
            local repo="${GLOBAL_REPO:-TheMuppets/proprietary_vendor_xiaomi_sm8450-common}"
            echo "Mode stock: blob Xiaomi SM8450 (samaan dengan stock ingres)"
            fetch_blobs "$repo" "${GLOBAL_URL:-https://github.com/$repo.git}" "${GLOBAL_BRANCH:-lineage-23.2}" "proprietary/"
            note "Mode stock (publik): blob Snapdragon 8 Gen 1 (SM8450) dari \`$repo\` branch \`$BLOB_BRANCH\` commit \`$BLOB_SHA\` ($BLOB_DATE)."
            note "Ini driver stock Xiaomi, bukan build komunitas 837.x; kemungkinan sama dengan driver yang sudah ada di ROM."
          }

          fetch_latest() {
            local line repo branch prefix ver date
            echo "Mode latest: cari driver Adreno 730 versi tertinggi di repo blob publik"
            line="$(python3 "$(dirname "$0")/find_latest.py" --out out/latest-scan.json)" || {
              echo "::error::Pencarian versi terbaru gagal. Coba source_mode=stock, atau custom dengan zip sendiri."
              exit 1
            }
            IFS=$'\t' read -r repo branch prefix ver date <<< "$line"
            echo "Terpilih: $repo@$branch -> v$ver ($date)"
            fetch_blobs "$repo" "${GLOBAL_BASE_URL:-https://github.com/}$repo.git" "$branch" "$prefix"
            note "Mode latest (publik): versi tertinggi dari kandidat yang lengkap = v$ver ($date), diambil dari \`$repo\` branch \`$BLOB_BRANCH\` commit \`$BLOB_SHA\`."
            note "Ini driver stock Qualcomm dari firmware OEM lain dengan SoC sama (bukan build komunitas 837.x); versi lebih baru dari stock ingres bila ada, bukan jaminan lebih cepat."
            python3 - <<'PYSCAN' >> out/source.txt
          import json
          d = json.load(open("out/latest-scan.json"))
          seen = {}
          for r in d["scanned"]:
              k = r["repo"].split("/")[-1].replace("proprietary_vendor_", "")
              if r.get("version"):
                  seen.setdefault(k, set()).add(r["version"] + ("" if r["ok"] else " (tidak lengkap, dilewati)"))
              else:
                  seen.setdefault(k, set()).add(r.get("why", "?"))
          print("Dipindai: " + "; ".join(f"{k}: {', '.join(sorted(v))}" for k, v in seen.items()))
          PYSCAN
          }

          # download_url <url> -> dl/   (release GitHub lewat gh + token repo; Drive/Mega/lainnya sesuai jenis link)
          download_url() {
            local url="$1" o r tag asset
            case "$url" in
              https://*|http://*) ;;
              *) echo "::error::src_url harus diawali http(s)://"; exit 1 ;;
            esac
            local gh_re='^https://github\.com/([^/]+)/([^/]+)/releases/download/([^/]+)/([^/?#]+)$'
            if [[ "$url" =~ $gh_re ]]; then
              o="${BASH_REMATCH[1]}"; r="${BASH_REMATCH[2]}"; tag="${BASH_REMATCH[3]}"; asset="${BASH_REMATCH[4]}"
              echo "Unduh dari GitHub Release $o/$r (tag $tag): $asset"
              if command -v gh >/dev/null 2>&1 && gh release download "$tag" --repo "$o/$r" --pattern "$asset" --dir dl --clobber; then
                return 0
              fi
              echo "::warning::gh gagal mengunduh, mencoba curl (hanya bekerja untuk repo publik)"
            fi
            case "$url" in
              *drive.google.com*|*docs.google.com*)
                echo "Unduh via gdown (Google Drive)"
                python3 -m pip install --quiet --break-system-packages gdown || python3 -m pip install --quiet gdown
                python3 -m gdown --fuzzy "$url" -O dl/
                ;;
              *mega.nz*|*mega.co.nz*)
                echo "Unduh via megatools (Mega)"
                sudo apt-get update -qq && sudo apt-get install -y -qq megatools >/dev/null
                megadl --path dl "$url"
                ;;
              *)
                echo "Unduh via curl"
                curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 1200 \
                  -A 'Mozilla/5.0 (X11; Linux x86_64)' -o "dl/$(basename "${url%%\?*}")" "$url"
                ;;
            esac
          }

          URL="${SRC_URL:-}"
          if [ -z "${SRC_PATH:-}" ] && [ -z "$URL" ] && [ "${SRC_MODE:-custom}" = "custom" ]; then
            URL="${DEFAULT_SRC_URL:-}"
            if [ -z "$URL" ]; then
              echo "::error::source_mode=custom butuh src_url atau src_path (tidak ada zip default)."
              exit 1
            fi
            echo "Memakai zip default: $URL"
          fi

          if [ -n "${SRC_PATH:-}" ]; then
            [ -e "$SRC_PATH" ] || { echo "::error::src_path tidak ditemukan di repo: $SRC_PATH"; exit 1; }
            cp -a "$SRC_PATH" dl/
            echo "Source dari repo: $SRC_PATH"
            note "Mode custom: file \`$SRC_PATH\` dari repo ini."
          elif [ -n "$URL" ]; then
            download_url "$URL"
            note "Mode custom: zip diunduh dari \`${URL%%\?*}\`."
          else
            case "${SRC_MODE:-custom}" in
              stock)  fetch_stock ;;
              latest|global) fetch_latest ;;
              *) echo "::error::source_mode tidak dikenal: ${SRC_MODE}"; exit 1 ;;
            esac
          fi

          # Tolak halaman HTML (login / captcha / link kedaluwarsa)
          for f in dl/*; do
            [ -f "$f" ] || continue
            if [ "$(head -c 512 "$f" | tr -d '\0' | grep -ciE '<!doctype html|<html' || true)" -gt 0 ]; then
              echo "::error::$(basename "$f") adalah halaman HTML, bukan file driver (link butuh login / kedaluwarsa?)."
              exit 1
            fi
          done

          n="$(find dl -mindepth 1 | wc -l)"
          [ "$n" -gt 0 ] || { echo "::error::Tidak ada file yang terunduh."; exit 1; }

          echo "Isi dl/:"
          ls -la dl
          for f in dl/*; do
            [ -f "$f" ] || continue
            sum="$(sha256sum "$f" | cut -d' ' -f1)"
            echo "sha256 $(basename "$f") = $sum"
            if [ -n "${SRC_SHA256:-}" ]; then
              want="$(printf '%s' "$SRC_SHA256" | tr 'A-F' 'a-f' | tr -d '[:space:]')"
              if [ "$sum" != "$want" ]; then
                echo "::error::SHA256 tidak cocok. diharapkan=$want didapat=$sum"
                exit 1
              fi
              echo "SHA256 cocok."
            fi
          done
          __AX_EOF_FETCH_SOURCE__

          cat > ax/scripts/find_latest.py <<'__AX_EOF_FIND_LATEST__'
          #!/usr/bin/env python3
          """Cari driver Adreno 730 (stock OEM) versi tertinggi di repo blob publik.

          Setiap kandidat (repo TheMuppets untuk perangkat Snapdragon 8 / 8+ Gen 1) dipindai pada beberapa
          branch lineage-* terbaru: versi dibaca dari string 'V@0615.98' di libGLESv2_adreno.so (tanpa
          mengunduh seluruh repo), lalu dicek kelengkapan file inti. Yang dipilih: versi tertinggi dan lengkap;
          versi sama -> urutan kandidat lebih awal menang, lalu branch PREFER_BRANCH
          (default lineage-23.2 = Android 16 QPR2), lalu branch terbaru.

          Pemakaian: find_latest.py --out out/latest-scan.json [--branches 3]
          Env: PREFER_BRANCH (default lineage-23.2), LATEST_CANDIDATES (satu repo per baris/koma: owner/repo atau URL git penuh),
               GLOBAL_BASE_URL (default https://github.com/)
          """
          import argparse
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path

          DEFAULT_CANDIDATES = [
              "TheMuppets/proprietary_vendor_xiaomi_sm8450-common",   # stock ingres / Xiaomi 12 (SM8450)
              "TheMuppets/proprietary_vendor_sony_sm8450-common",     # Xperia 1 IV / 5 IV (SM8450)
              "TheMuppets/proprietary_vendor_nothing_pong",           # Nothing Phone (2) (SM8475)
              "TheMuppets/proprietary_vendor_motorola_sm8475-common",  # Motorola (SM8475)
          ]

          # file inti yang harus ada (relatif terhadap <prefix>vendor/) supaya paket tidak setengah-setengah
          REQUIRED = [
              "lib64/egl/libGLESv2_adreno.so",
              "lib64/egl/libEGL_adreno.so",
              "lib64/hw/vulkan.adreno.so",
              "lib64/libgsl.so",
              "lib64/libadreno_utils.so",
              "lib/egl/libGLESv2_adreno.so",
              "lib/libgsl.so",
          ]

          ENV = dict(os.environ, GIT_TERMINAL_PROMPT="0")


          def git(*args, cwd=None, timeout=120, text=True):
              return subprocess.run(["git", *args], cwd=cwd, env=ENV, capture_output=True, text=text, timeout=timeout)


          def log(msg):
              print(msg, file=sys.stderr, flush=True)


          def clone_url(cand):
              if "://" in cand or cand.startswith("/") or cand.startswith("file:"):
                  return cand
              base = os.environ.get("GLOBAL_BASE_URL", "https://github.com/")
              return f"{base.rstrip('/')}/{cand}.git"


          def branch_key(b):
              m = re.fullmatch(r"lineage-(\d+)(?:\.(\d+))?", b)
              return (int(m.group(1)), int(m.group(2) or 0)) if m else None


          def scan_branch(cand, url, branch, tmp):
              res = {"repo": cand, "branch": branch, "ok": False}
              d = Path(tmp) / re.sub(r"[^\w.-]", "_", f"{cand}@{branch}")
              r = git("clone", "-q", "--depth", "1", "--filter=blob:none", "--no-checkout", "-b", branch, url, str(d))
              if r.returncode != 0:
                  res["why"] = "clone gagal"
                  return res
              ls = git("ls-tree", "-r", "--name-only", "HEAD", cwd=d)
              paths = set(ls.stdout.split("\n"))
              prefix = None
              for p in paths:
                  m = re.fullmatch(r"(.*)vendor/lib64/egl/libGLESv2_adreno\.so", p)
                  if m:
                      prefix = m.group(1)
                      break
              if prefix is None:
                  res["why"] = "tanpa libGLESv2_adreno.so"
                  return res
              missing = [f for f in REQUIRED if f"{prefix}vendor/{f}" not in paths]
              blob = git("show", f"HEAD:{prefix}vendor/lib64/egl/libGLESv2_adreno.so", cwd=d, text=False).stdout
              vers = {(int(a), int(b)) for a, b in re.findall(rb"V@0*(\d+)\.(\d+) \(GIT@", blob)}
              if not vers:
                  res["why"] = "versi tidak terbaca"
                  return res
              ver = max(vers)
              dm = re.search(rb"\(Date:(\d\d/\d\d/\d\d)\)", blob)
              res.update(
                  prefix=prefix,
                  version=f"{ver[0]}.{ver[1]}",
                  vkey=list(ver),
                  date=dm.group(1).decode() if dm else "",
                  commit=git("rev-parse", "--short=10", "HEAD", cwd=d).stdout.strip(),
              )
              if missing:
                  res["why"] = "tidak lengkap: " + ", ".join(missing)
                  return res
              res["ok"] = True
              return res


          def scan_candidate(idx, cand, nbranch, tmp):
              url = clone_url(cand)
              r = git("ls-remote", "--heads", url)
              if r.returncode != 0:
                  return [{"repo": cand, "ok": False, "why": "repo tidak bisa diakses", "idx": idx}]
              names = [ln.split("refs/heads/", 1)[1] for ln in r.stdout.splitlines() if "refs/heads/" in ln]
              brs = sorted((b for b in names if branch_key(b)), key=branch_key, reverse=True)[:nbranch]
              if not brs:
                  return [{"repo": cand, "ok": False, "why": "tanpa branch lineage-*", "idx": idx}]
              out = []
              for b in brs:
                  try:
                      res = scan_branch(cand, url, b, tmp)
                  except subprocess.TimeoutExpired:
                      res = {"repo": cand, "branch": b, "ok": False, "why": "timeout"}
                  res["idx"] = idx
                  out.append(res)
              return out


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--out", required=True)
              ap.add_argument("--branches", type=int, default=3)
              a = ap.parse_args()

              raw = os.environ.get("LATEST_CANDIDATES", "").strip()
              cands = [c for c in re.split(r"[\s,]+", raw) if c] or DEFAULT_CANDIDATES

              tmp = tempfile.mkdtemp(prefix="axscan_")
              try:
                  with ThreadPoolExecutor(max_workers=4) as ex:
                      groups = list(ex.map(lambda ic: scan_candidate(ic[0], ic[1], a.branches, tmp), enumerate(cands)))
              finally:
                  shutil.rmtree(tmp, ignore_errors=True)

              rows = [r for g in groups for r in g]
              for r in rows:
                  tag = "OK   " if r["ok"] else "skip "
                  ver = r.get("version", "-")
                  log(f"{tag} {r['repo']}@{r.get('branch', '-')}: v{ver} {r.get('date', '')} {r.get('why', '')}".rstrip())

              ok = [r for r in rows if r["ok"]]
              if not ok:
                  log("::error::Tidak ada kandidat publik yang lengkap. Pakai source_mode=stock atau custom.")
                  Path(a.out).write_text(json.dumps({"best": None, "scanned": rows}, indent=2) + "\n")
                  sys.exit(1)
              # versi tertinggi; seri -> idx kandidat lebih kecil, lalu branch lebih baru
              prefer = os.environ.get("PREFER_BRANCH", "lineage-23.2")
              best = sorted(ok, key=lambda r: (tuple(-x for x in r["vkey"]), r["idx"], 0 if r["branch"] == prefer else 1,
                                               tuple(-x for x in branch_key(r["branch"]))))[0]
              Path(a.out).write_text(json.dumps({"best": best, "scanned": rows}, indent=2) + "\n")
              print(f"{best['repo']}\t{best['branch']}\t{best['prefix']}\t{best['version']}\t{best['date']}")


          if __name__ == "__main__":
              main()
